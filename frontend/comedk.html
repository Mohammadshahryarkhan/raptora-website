<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raptora | COMEDK College Predictor</title>
    <link rel="stylesheet" href="css/comedk.css">
</head>

<body>

    <div class="container">
        <div class="card">

            <h1>COMEDK College Predictor</h1>
            <p>Based on Official COMEDK UGET Counselling Cutoffs</p>

            <label for="marks">COMEDK Score (out of 180)</label>
            <input type="number" id="marks" min="0" max="180" placeholder="Enter COMEDK Marks (0-180)">

            <label for="category">Category / Reservation</label>
            <select id="category">
                <option value="GM">GM (General Merit - All India)</option>
                <option value="HK">HKR (Hyderabad-Karnataka Region)</option>
                <option value="TULU">Tulu Minority</option>
                <option value="TELUGU">Telugu Minority</option>
            </select>

            <label for="city">Preferred Region / City</label>
            <select id="city">
                <option value="ALL">All Cities</option>
                <option value="Bangalore">Bangalore</option>
                <option value="Mysuru">Mysuru</option>
                <option value="Tumkur">Tumkur / Other Region</option>
            </select>

            <label for="branch">Preferred Branch Group</label>
            <select id="branch">
                <option value="ALL">All Branches</option>
                <option value="CSE">Computer Science / IT / AI & ML / Data Science</option>
                <option value="ECE">Electronics & Electrical (ECE/EEE/EIE)</option>
                <option value="MECH">Mechanical / Civil / Chemical / Biotech</option>
            </select>

            <button onclick="predictComedk()">
                Predict Eligible Colleges
            </button>

            <div id="result"></div>

        </div>
    </div>

    <script>
        /**
         * COMEDK Category Multipliers
         */
        const CATEGORY_FACTOR = {
            "GM": 1.0,
            "HK": 1.25,
            "TULU": 1.35,
            "TELUGU": 1.35
        };

        /**
         * Real-World COMEDK Score vs Rank Mapping (Out of 180 Marks)
         */
        function calculateComedkRank(marks) {
            if (marks >= 165) return 100;
            if (marks >= 155) return 300;
            if (marks >= 145) return 700;
            if (marks >= 135) return 1400;
            if (marks >= 125) return 2500;
            if (marks >= 115) return 4500;
            if (marks >= 105) return 7500;
            if (marks >= 95)  return 12000;
            if (marks >= 85)  return 18000;
            if (marks >= 75)  return 26000;
            if (marks >= 65)  return 36000;
            if (marks >= 55)  return 50000;
            return 70000;
        }

        /**
         * Database of Major COMEDK Participating Engineering Institutes
         */
        const COMEDK_DATABASE = [
            { name: "R.V. College of Engineering (RVCE)", city: "Bangalore", cse: 450, ece: 1200, mech: 6500 },
            { name: "B.M.S. College of Engineering (BMSCE)", city: "Bangalore", cse: 1100, ece: 2800, mech: 12000 },
            { name: "M.S. Ramaiah Institute of Technology (MSRIT)", city: "Bangalore", cse: 1400, ece: 3400, mech: 14000 },
            { name: "Bangalore Institute of Technology (BIT)", city: "Bangalore", cse: 3800, ece: 9500, mech: 28000 },
            { name: "Dayananda Sagar College of Engineering (DSCE)", city: "Bangalore", cse: 4500, ece: 11000, mech: 32000 },
            { name: "Sir M. Visvesvaraya Institute of Technology (Sir MVIT)", city: "Bangalore", cse: 7500, ece: 15000, mech: 42000 },
            { name: "JSS Science & Technology University (SJCE)", city: "Mysuru", cse: 3200, ece: 7000, mech: 22000 },
            { name: "National Institute of Engineering (NIE)", city: "Mysuru", cse: 5500, ece: 12000, mech: 26000 },
            { name: "Siddaganga Institute of Technology (SIT)", city: "Tumkur", cse: 6800, ece: 14000, mech: 38000 },
            { name: "BMS Institute of Technology and Management (BMSIT)", city: "Bangalore", cse: 7000, ece: 16000, mech: 45000 },
            { name: "Nitte Meenakshi Institute of Technology (NMIT)", city: "Bangalore", cse: 8500, ece: 18000, mech: 48000 },
            { name: "New Horizon College of Engineering (NHCE)", city: "Bangalore", cse: 11000, ece: 22000, mech: 52000 },
            { name: "CMR Institute of Technology (CMRIT)", city: "Bangalore", cse: 13000, ece: 25000, mech: 56000 },
            { name: "RNS Institute of Technology (RNSIT)", city: "Bangalore", cse: 9500, ece: 20000, mech: 50000 },
            { name: "REVA University", city: "Bangalore", cse: 16000, ece: 30000, mech: 60000 }
        ];

        function getEligibleColleges(rank, category, selectedCity, selectedBranch) {
            const factor = CATEGORY_FACTOR[category] || 1.0;
            let results = [];

            COMEDK_DATABASE.forEach(item => {
                // Filter by City
                if (selectedCity !== "ALL" && item.city.toLowerCase() !== selectedCity.toLowerCase()) {
                    return;
                }

                const cseCutoff = Math.round(item.cse * factor);
                const eceCutoff = Math.round(item.ece * factor);
                const mechCutoff = Math.round(item.mech * factor);

                let matchedBranches = [];

                if ((selectedBranch === "ALL" || selectedBranch === "CSE") && rank <= cseCutoff) {
                    matchedBranches.push({ branch: "Computer Science (CSE / AI & ML / ISE)", closingRank: cseCutoff });
                }
                if ((selectedBranch === "ALL" || selectedBranch === "ECE") && rank <= eceCutoff) {
                    matchedBranches.push({ branch: "Electronics & Communication (ECE / EEE)", closingRank: eceCutoff });
                }
                if ((selectedBranch === "ALL" || selectedBranch === "MECH") && rank <= mechCutoff) {
                    matchedBranches.push({ branch: "Mechanical / Civil / Chemical", closingRank: mechCutoff });
                }

                if (matchedBranches.length > 0) {
                    results.push({
                        college: item.name,
                        city: item.city,
                        branches: matchedBranches
                    });
                }
            });

            return results;
        }

        async function predictComedk() {
            const marksVal = document.getElementById("marks").value;
            const category = document.getElementById("category").value;
            const selectedCity = document.getElementById("city").value;
            const selectedBranch = document.getElementById("branch").value;

            if (marksVal === "") {
                alert("Please enter your COMEDK marks.");
                return;
            }

            const marks = Number(marksVal);

            if (marks < 0 || marks > 180) {
                alert("COMEDK marks must be between 0 and 180.");
                return;
            }

            const estimatedRank = calculateComedkRank(marks);

            document.getElementById("result").innerHTML = "<p>⏳ Calculating estimated COMEDK rank and filtering colleges...</p>";

            try {
                // Send request to Render Backend API
                const response = await fetch("https://raptora-website-1.onrender.com/api/comedk/predict", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        rank: estimatedRank,
                        category: category,
                        city: selectedCity,
                        branch: selectedBranch
                    })
                });

                const data = await response.json();

                if (response.ok && data.data && data.data.length > 0) {
                    renderBackendResults(data.data, estimatedRank, category, selectedCity, selectedBranch);
                } else {
                    const localData = getEligibleColleges(estimatedRank, category, selectedCity, selectedBranch);
                    renderLocalResults(localData, estimatedRank, category, selectedCity, selectedBranch);
                }

            } catch (error) {
                console.warn("Backend API offline. Using local COMEDK database engine:", error);
                const localData = getEligibleColleges(estimatedRank, category, selectedCity, selectedBranch);
                renderLocalResults(localData, estimatedRank, category, selectedCity, selectedBranch);
            }
        }

        function renderLocalResults(colleges, rank, category, city, branch) {
            let html = `
                <h2>Prediction Result</h2>
                <p><strong>Estimated COMEDK Rank:</strong> ~${rank.toLocaleString()}</p>
                <p><strong>Filters Applied:</strong> Category: ${category} | City: ${city} | Branch: ${branch}</p>
                <hr>
                <h3>Eligible Colleges (${colleges.length} Found)</h3>
            `;

            if (colleges.length === 0) {
                html += `<p>No colleges found matching these criteria for your rank. Try changing the city or branch filter.</p>`;
            } else {
                colleges.forEach(item => {
                    html += `
                        <div class="college" style="border: 1px solid #ddd; padding: 12px; margin-bottom: 12px; border-radius: 6px; text-align: left;">
                            <h3 style="margin-top:0;">🏛 ${item.college} (${item.city})</h3>
                            <ul style="margin: 5px 0; padding-left: 20px;">
                                ${item.branches.map(b => `<li><strong>${b.branch}</strong> (Expected Cutoff Rank: ~${b.closingRank.toLocaleString()})</li>`).join('')}
                            </ul>
                        </div>
                    `;
                });
            }

            document.getElementById("result").innerHTML = html;
        }

        function renderBackendResults(colleges, rank, category, city, branch) {
            let html = `
                <h2>Prediction Result</h2>
                <p><strong>Estimated COMEDK Rank:</strong> ~${rank.toLocaleString()}</p>
                <p><strong>Filters Applied:</strong> ${category} | City: ${city} | Branch: ${branch}</p>
                <hr>
                <h3>Eligible Colleges</h3>
            `;

            colleges.forEach(c => {
                html += `
                    <div class="college" style="border: 1px solid #ddd; padding: 12px; margin-bottom: 10px; border-radius: 6px; text-align: left;">
                        <h3>🏛 ${c.college} ${c.city ? `(${c.city})` : ''}</h3>
                        <p>📚 <strong>Branch:</strong> ${c.branch}</p>
                        <p>Category: ${c.category || category}</p>
                        <p>Closing Rank: ${c.closingRank}</p>
                    </div>
                `;
            });

            document.getElementById("result").innerHTML = html;
        }
    </script>

</body>

</html>
