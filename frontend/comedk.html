<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COMEDK 2026 College Predictor</title>
  <style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Poppins',sans-serif;
    }

    body{
        min-height:100vh;
        background:#000;
        display:flex;
        justify-content:center;
        align-items:center;
        color:white;
        padding:20px 0;
    }

    .container{
        width:100%;
        display:flex;
        justify-content:center;
        align-items:center;
    }

    .card{
        width:420px;
        padding:35px;
        background:#111;
        border-radius:20px;
        box-shadow:0 0 25px rgba(255,0,0,0.5);
        border:1px solid #ff0000;
    }

    .card h1{
        text-align:center;
        color:#ff1a1a;
        margin-bottom:10px;
    }

    .card p{
        text-align:center;
        color:#ccc;
        margin-bottom:25px;
    }

    label{
        display:block;
        margin-top:15px;
        margin-bottom:8px;
        color:#ff4d4d;
        font-weight:600;
    }

    input,
    select{
        width:100%;
        padding:12px;
        background:#000;
        color:white;
        border:1px solid #ff0000;
        border-radius:8px;
        outline:none;
    }

    input:focus,
    select:focus{
        box-shadow:0 0 10px red;
    }

    button{
        width:100%;
        margin-top:25px;
        padding:14px;
        background:#ff0000;
        color:white;
        border:none;
        border-radius:10px;
        font-size:16px;
        font-weight:bold;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        background:#b30000;
        transform:scale(1.03);
    }

    #result{
        margin-top:25px;
    }

    #result h2{
        color:#ff1a1a;
    }

    .college{
        background:#1a1a1a;
        border-left:5px solid #ff0000;
        padding:15px;
        margin-top:15px;
        border-radius:10px;
    }

    .college h3{
        color:#ff3333;
        margin-bottom:8px;
    }

    .college p{
        text-align:left;
        margin:5px 0;
        color:white;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h1>COMEDK Predictor</h1>
    <p>COMEDK UGET 2026 College & Branch Finder</p>

    <form id="comedkForm">
      <label for="rank">COMEDK Rank</label>
      <input type="number" id="rank" placeholder="Enter your COMEDK Rank" required min="1" max="120000" />

      <label for="pcm">12th PCM Percentage (%)</label>
      <input type="number" id="pcm" placeholder="e.g. 75.5" step="0.1" required min="35" max="100" />

      <label for="domicile">Domicile State</label>
      <select id="domicile" required>
        <option value="Non-Karnataka">Non-Karnataka (All India Pool)</option>
        <option value="Karnataka">Karnataka State</option>
      </select>

      <label for="category">Category (Eligibility Criteria)</label>
      <select id="category" required>
        <option value="GM">General Merit (GM)</option>
        <option value="OBC">OBC (Karnataka Only)</option>
        <option value="SC">SC (Karnataka Only)</option>
        <option value="ST">ST (Karnataka Only)</option>
      </select>

      <label for="kkr">Kalyana Karnataka (371J) Quota</label>
      <select id="kkr" required>
        <option value="No">No / Not Applicable</option>
        <option value="Yes">Yes (371J Certificate Holder)</option>
      </select>

      <label for="branch">Preferred Branch</label>
      <select id="branch">
        <option value="ALL">All Branches</option>
        <option value="CSE">Computer Science & AI/ML</option>
        <option value="ECE">Electronics & Comm (ECE)</option>
        <option value="MECH">Mechanical / Civil / Other</option>
      </select>

      <button type="submit">Predict Colleges</button>
    </form>

    <div id="result"></div>
  </div>
</div>

<script>
// Mock Dataset matching COMEDK Colleges and Cutoffs
const collegesData = [
  { name: "RV College of Engineering (RVCE)", location: "Bengaluru", branch: "CSE", code: "CSE", fee: "₹2,61,477/yr", cutoffGM: 400, cutoffKKR: 1800 },
  { name: "RV College of Engineering (RVCE)", location: "Bengaluru", branch: "Electronics & Communication", code: "ECE", fee: "₹2,61,477/yr", cutoffGM: 1200, cutoffKKR: 4200 },
  { name: "BMS College of Engineering (BMSCE)", location: "Bengaluru", branch: "Computer Science & Engineering", code: "CSE", fee: "₹2,61,477/yr", cutoffGM: 1300, cutoffKKR: 3800 },
  { name: "BMS College of Engineering (BMSCE)", location: "Bengaluru", branch: "Electronics & Communication", code: "ECE", fee: "₹2,61,477/yr", cutoffGM: 2800, cutoffKKR: 8500 },
  { name: "MS Ramaiah Institute of Technology (MSRIT)", location: "Bengaluru", branch: "Computer Science & Engineering", code: "CSE", fee: "₹2,61,477/yr", cutoffGM: 1400, cutoffKKR: 4100 },
  { name: "Dayananda Sagar College of Engineering (DSCE)", location: "Bengaluru", branch: "Computer Science & Engineering", code: "CSE", fee: "₹2,61,477/yr", cutoffGM: 4200, cutoffKKR: 12000 },
  { name: "Bangalore Institute of Technology (BIT)", location: "Bengaluru", branch: "Computer Science & Engineering", code: "CSE", fee: "₹2,25,000/yr", cutoffGM: 6500, cutoffKKR: 18000 },
  { name: "Siddaganga Institute of Technology (SIT)", location: "Tumakuru", branch: "Computer Science & Engineering", code: "CSE", fee: "₹2,25,000/yr", cutoffGM: 9500, cutoffKKR: 24000 },
  { name: "Sir M. Visvesvaraya Institute of Technology", location: "Bengaluru", branch: "Computer Science & Engineering", code: "CSE", fee: "₹2,25,000/yr", cutoffGM: 11500, cutoffKKR: 29000 },
  { name: "AMC Engineering College", location: "Bengaluru", branch: "Computer Science & Engineering", code: "CSE", fee: "₹2,00,000/yr", cutoffGM: 35000, cutoffKKR: 55000 },
  { name: "AMC Engineering College", location: "Bengaluru", branch: "AI & Machine Learning", code: "CSE", fee: "₹2,20,000/yr", cutoffGM: 40000, cutoffKKR: 60000 },
  { name: "AMC Engineering College", location: "Bengaluru", branch: "Electronics & Communication", code: "ECE", fee: "₹1,70,000/yr", cutoffGM: 50000, cutoffKKR: 75000 },
  { name: "AMC Engineering College", location: "Bengaluru", branch: "Mechanical Engineering", code: "MECH", fee: "₹1,45,000/yr", cutoffGM: 80000, cutoffKKR: 100000 }
];

document.getElementById('comedkForm').addEventListener('submit', function(e) {
  e.preventDefault();

  const rank = parseInt(document.getElementById('rank').value);
  const pcm = parseFloat(document.getElementById('pcm').value);
  const domicile = document.getElementById('domicile').value;
  const category = document.getElementById('category').value;
  const isKKR = document.getElementById('kkr').value === 'Yes';
  const branchPref = document.getElementById('branch').value;
  const resultDiv = document.getElementById('result');

  // 1. Check COMEDK 12th PCM Eligibility Criteria
  const requiredPCM = (domicile === 'Karnataka' && (category === 'SC' || category === 'ST' || category === 'OBC')) ? 40.0 : 45.0;

  if (pcm < requiredPCM) {
    resultDiv.innerHTML = `
      <h2>Eligibility Result</h2>
      <div class="college">
        <h3>Ineligible for Counselling</h3>
        <p>Your 12th PCM percentage is <strong>${pcm}%</strong>.</p>
        <p>Minimum required aggregate for ${category} (${domicile}) is <strong>${requiredPCM}%</strong> in PCM.</p>
      </div>
    `;
    return;
  }

  // 2. Filter Colleges according to COMEDK Rules
  let results = [];

  collegesData.forEach(col => {
    if (branchPref !== 'ALL' && col.code !== branchPref) return;

    // Check GM Cutoff (Open to all candidates)
    if (rank <= col.cutoffGM * 1.25) {
      results.push({
        name: col.name,
        branch: col.branch,
        location: col.location,
        fee: col.fee,
        cutoff: col.cutoffGM,
        quota: "General Merit (GM Pool)"
      });
    }

    // Check KKR Quota (Strictly for Karnataka + 371J Certificate)
    if (isKKR && domicile === 'Karnataka' && rank <= col.cutoffKKR * 1.25) {
      results.push({
        name: col.name,
        branch: col.branch,
        location: col.location,
        fee: col.fee,
        cutoff: col.cutoffKKR,
        quota: "Kalyana Karnataka (371J)"
      });
    }
  });

  // 3. Render Results
  if (results.length === 0) {
    resultDiv.innerHTML = `
      <h2>Results</h2>
      <div class="college">
        <h3>No Colleges Found</h3>
        <p>No matching options found for rank ${rank}. Try selecting 'All Branches'.</p>
      </div>
    `;
    return;
  }

  let html = `<h2>Predicted Colleges (${results.length})</h2>`;
  results.forEach(col => {
    html += `
      <div class="college">
        <h3>${col.name}</h3>
        <p><strong>Branch:</strong> ${col.branch}</p>
        <p><strong>Location:</strong> ${col.location}</p>
        <p><strong>Fee:</strong> ${col.fee}</p>
        <p><strong>Applied Quota:</strong> ${col.quota}</p>
        <p><strong>Expected Cutoff:</strong> ~${col.cutoff}</p>
      </div>
    `;
  });

  resultDiv.innerHTML = html;
});
</script>

</body>
</html>
