<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Raptora | My Profile</title>

    <link rel="stylesheet" href="css/profile.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


<div class="profile-container">


    <div class="profile-card">


        <div class="profile-icon">

            <i class="fa-solid fa-user"></i>

        </div>


        <h1>My Profile</h1>


        <div class="details">


            <p>
                <strong>Name:</strong>
                <span id="name"></span>
            </p>


            <p>
                <strong>Email:</strong>
                <span id="email"></span>
            </p>


            <p>
                <strong>Phone:</strong>
                <span id="phone"></span>
            </p>


        </div>


        <button onclick="goBack()">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Dashboard
        </button>


    </div>


</div>



<script>


const name = localStorage.getItem("name");

const email = localStorage.getItem("email");

const phone = localStorage.getItem("phone");



document.getElementById("name").innerText = name || "Not Available";

document.getElementById("email").innerText = email || "Not Available";

document.getElementById("phone").innerText = phone || "Not Available";



function goBack(){

    window.location.href="dashboard.html";

}


</script>


</body>

</html>
