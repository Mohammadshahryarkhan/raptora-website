<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Raptora | Login</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/login.css">

    <!-- GSAP Animation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>

<body>

<!-- Liquid Bucket Splash Overlay -->
<div class="splash-overlay" id="splashOverlay">
    <div class="water-bucket-wave" id="liquidWave"></div>
</div>

<div class="container" id="mainContainer">

    <!-- Left Panel -->
    <div class="left-panel">
        <div class="overlay">
            <h1>RAPTORA</h1>
            <p>Empowering Innovation Through Technology</p>
            <img src="register.png" alt="Login Illustration">
        </div>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
        <div class="login-box">
            <h2>Welcome Back 👋</h2>
            <p>Login to continue to your dashboard.</p>

            <!-- Login Form -->
            <form id="loginForm">
                <!-- Email -->
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <div class="input-field">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>
                    </div>
                </div>

                <!-- Password -->
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-field">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
                        <i class="fa-solid fa-eye eye" id="togglePassword" onclick="togglePassword()"></i>
                    </div>
                </div>

                <!-- Remember Me + Forgot Password -->
                <div class="options">
                    <label>
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        Remember Me
                    </label>
                    <a href="forgot-password.html">Forgot Password?</a>
                </div>

                <!-- Login Button -->
                <button type="submit">Login</button>
            </form>

            <!-- Divider -->
            <div class="divider">
                <span>OR</span>
            </div>

            <!-- Register -->
            <div class="register">
                Don't have an account?
                <a href="register.html">Register Now</a>
            </div>
        </div>
    </div>

</div>

<script>
    // Show / Hide Password
    function togglePassword() {
        const password = document.getElementById("password");
        const icon = document.getElementById("togglePassword");

        if (password.type === "password") {
            password.type = "text";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        } else {
            password.type = "password";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    }

    // Remember Me Logic
    const emailInput = document.getElementById("email");
    const rememberMe = document.getElementById("rememberMe");

    window.addEventListener("DOMContentLoaded", function () {
        const savedEmail = localStorage.getItem("raptoraRememberedEmail");
        if (savedEmail) {
            emailInput.value = savedEmail;
            rememberMe.checked = true;
        }
    });

    document.getElementById("loginForm").addEventListener("submit", function () {
        if (rememberMe.checked) {
            localStorage.setItem("raptoraRememberedEmail", emailInput.value);
        } else {
            localStorage.removeItem("raptoraRememberedEmail");
        }
    });

    // Bucket Splash Wipe Script
    window.addEventListener("load", () => {
        const tl = gsap.timeline();

        // Screen sweep like water thrown from bucket
        tl.to("#liquidWave", {
            duration: 1.1,
            clipPath: "polygon(0 0, 100% 0, 100% 100%, 0 100%)",
            ease: "power4.inOut"
        })
        .to("#splashOverlay", {
            duration: 0.4,
            opacity: 0,
            onComplete: () => {
                document.getElementById("splashOverlay").style.display = "none";
            }
        })
        .from("#mainContainer", {
            duration: 0.8,
            scale: 0.9,
            opacity: 0,
            ease: "power3.out"
        }, "-=0.3");
    });
</script>

<!-- Login JavaScript (Backend API intact) -->
<script src="js/login.js"></script>

</body>
</html>
