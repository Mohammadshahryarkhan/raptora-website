<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Raptora | Forgot Password</title>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }


        body {
            min-height: 100vh;
            background: #090909;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }


        .container {
            width: 90%;
            max-width: 1100px;
            min-height: 650px;
            display: flex;
            background: #111;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 0 35px rgba(255, 0, 0, 0.25);
        }


        /* Left Panel */

        .left-panel {
            width: 50%;
            background: linear-gradient(
                135deg,
                #160000,
                #090000
            );

            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }


        .overlay {
            padding: 40px;
        }


        .overlay h1 {
            font-size: 60px;
            font-weight: 700;
            color: #ff172d;
            letter-spacing: 3px;
        }


        .overlay p {
            margin-top: 15px;
            font-size: 18px;
            color: #ddd;
        }


        .overlay img {
            width: 70%;
            max-width: 400px;
            margin-top: 50px;
            border-radius: 10px;
        }


        /* Right Panel */

        .right-panel {
            width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #151515;
        }


        .forgot-box {
            width: 80%;
            max-width: 450px;
        }


        .forgot-box h2 {
            font-size: 34px;
            margin-bottom: 10px;
        }


        .forgot-box > p {
            color: #aaa;
            margin-bottom: 35px;
        }


        .input-group {
            margin-bottom: 25px;
        }


        .input-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 500;
        }


        .input-field {
            height: 60px;
            background: #252525;
            border: 1px solid #3a3a3a;
            border-radius: 10px;
            display: flex;
            align-items: center;
            padding: 0 18px;
        }


        .input-field i {
            color: #ff1730;
            margin-right: 12px;
        }


        .input-field input {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            font-size: 15px;
        }


        .input-field input::placeholder {
            color: #888;
        }


        button {
            width: 100%;
            height: 60px;
            border: none;
            border-radius: 10px;
            background: #ed0718;
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }


        button:hover {
            background: #ff1d31;
            transform: translateY(-2px);
        }


        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }


        .back-login {
            text-align: center;
            margin-top: 25px;
        }


        .back-login a {
            color: #ff1730;
            text-decoration: none;
            font-weight: 600;
        }


        .back-login a:hover {
            text-decoration: underline;
        }


        #message {
            display: none;
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            background: #182b18;
            color: #6cff6c;
        }


        /* Mobile */

        @media (max-width: 800px) {

            .container {
                width: 95%;
                min-height: auto;
            }


            .left-panel {
                display: none;
            }


            .right-panel {
                width: 100%;
                padding: 60px 20px;
            }


            .forgot-box {
                width: 100%;
            }


            .forgot-box h2 {
                font-size: 28px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- Left Panel -->

    <div class="left-panel">

        <div class="overlay">

            <h1>RAPTORA</h1>

            <p>
                Empowering Innovation Through Technology
            </p>

            <img
                src="register.png"
                alt="Raptora">

        </div>

    </div>


    <!-- Right Panel -->

    <div class="right-panel">

        <div class="forgot-box">


            <h2>
                Forgot Password 🔐
            </h2>


            <p>

                Enter your registered email address and we'll help
                you reset your password.

            </p>


            <!-- Forgot Password Form -->

            <form id="forgotPasswordForm">


                <div class="input-group">


                    <label for="email">

                        Email Address

                    </label>


                    <div class="input-field">


                        <i class="fa-solid fa-envelope"></i>


                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required>


                    </div>


                </div>


                <button type="submit">

                    <i class="fa-solid fa-paper-plane"></i>

                    Send Reset Link

                </button>


            </form>


            <!-- Message -->

            <div id="message"></div>


            <!-- Back to Login -->

            <div class="back-login">

                <a href="login.html">

                    <i class="fa-solid fa-arrow-left"></i>

                    Back to Login

                </a>

            </div>


        </div>

    </div>


</div>



<script>


    const form =
        document.getElementById("forgotPasswordForm");


    const message =
        document.getElementById("message");


    const button =
        form.querySelector("button");



    form.addEventListener(
        "submit",
        async function (event) {


            event.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();



            if (!email) {

                return;

            }



            // Loading state

            button.disabled = true;


            button.innerHTML =
                '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';



            message.style.display = "block";


            message.style.background =
                "#182b18";


            message.style.color =
                "#6cff6c";


            message.textContent =
                "Sending reset link...";



            try {


                const response =
                    await fetch(
                        "/api/auth/forgot-password",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body: JSON.stringify({

                                email: email

                            })

                        }
                    );



                const data =
                    await response.json();



                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Something went wrong."
                    );

                }



                message.textContent =
                    data.message;



            } catch (error) {


                console.error(
                    "Forgot Password Error:",
                    error
                );


                message.style.background =
                    "#351818";


                message.style.color =
                    "#ff6c6c";


                message.textContent =
                    "Unable to send reset link. Please try again.";


            }



            // Restore button

            button.disabled = false;


            button.innerHTML =
                '<i class="fa-solid fa-paper-plane"></i> Send Reset Link';


        }

    );

</script>


</body>

</html>
