<script>
const API_URL = "https://raptora-website.onrender.com";

document.addEventListener("DOMContentLoaded", () => {

    const form = document.getElementById("forgotPasswordForm");
    const message = document.getElementById("message");
    const emailInput = document.getElementById("email");

    // Check required elements
    if (!form) {
        console.error("Forgot Password: #forgotPasswordForm not found.");
        return;
    }

    if (!message) {
        console.error("Forgot Password: #message not found.");
        return;
    }

    if (!emailInput) {
        console.error("Forgot Password: #email not found.");
        return;
    }

    const button = form.querySelector("button");

    if (!button) {
        console.error("Forgot Password: submit button not found.");
        return;
    }

    form.addEventListener("submit", async (event) => {

        event.preventDefault();

        const email = emailInput.value.trim();

        // Clear previous message
        message.style.display = "block";

        // Validate email
        if (!email) {
            message.style.background = "#351818";
            message.style.color = "#ff6c6c";
            message.textContent = "Please enter your email.";
            return;
        }

        // Basic email validation
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!emailPattern.test(email)) {
            message.style.background = "#351818";
            message.style.color = "#ff6c6c";
            message.textContent = "Please enter a valid email address.";
            return;
        }

        // Disable button
        button.disabled = true;

        button.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';

        // Show loading message
        message.style.background = "#182b18";
        message.style.color = "#6cff6c";
        message.textContent = "Sending reset link...";

        try {

            console.log("Sending forgot password request...");

            const response = await fetch(
                `${API_URL}/api/auth/forgot-password`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },

                    body: JSON.stringify({
                        email: email
                    })
                }
            );

            console.log("HTTP status:", response.status);

            // Get response safely
            let data;

            try {
                data = await response.json();
            } catch (jsonError) {
                console.error("Invalid JSON response:", jsonError);
                throw new Error("Server returned an invalid response.");
            }

            console.log("Backend response:", data);

            // Backend error
            if (!response.ok) {
                throw new Error(
                    data.message ||
                    "Unable to send reset link. Please try again."
                );
            }

            // Success
            message.style.background = "#182b18";
            message.style.color = "#6cff6c";

            message.textContent =
                data.message ||
                "Reset link sent successfully. Please check your email.";

            // Clear email field after success
            emailInput.value = "";

        } catch (error) {

            console.error("Forgot Password Error:", error);

            message.style.background = "#351818";
            message.style.color = "#ff6c6c";

            // Handle common errors
            if (error.name === "TypeError") {

                message.textContent =
                    "Unable to connect to the server. Please try again.";

            } else {

                message.textContent =
                    error.message ||
                    "Unable to send reset link. Please try again.";
            }

        } finally {

            // Re-enable button
            button.disabled = false;

            button.innerHTML =
                '<i class="fa-solid fa-paper-plane"></i> Send Reset Link';
        }

    });

});
</script>
