<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Raptora</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #000000;
            --card: #0d0d0d;
            --card-2: #111111;
            --border: #292929;
            --red: #e50914;
            --red-light: #ff1a1a;
            --red-dark: #7f0000;
            --white: #ffffff;
            --gray: #999999;
            --gray-light: #cccccc;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                radial-gradient(
                    circle at top,
                    rgba(229, 9, 20, 0.10),
                    transparent 35%
                ),
                #000000;

            color: var(--white);

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .page {
            width: 100%;
            max-width: 430px;
        }

        .card {
            width: 100%;

            background:
                linear-gradient(
                    145deg,
                    #111111,
                    #080808
                );

            border: 1px solid var(--border);

            border-radius: 18px;

            padding: 40px 32px;

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.65),
                0 0 35px rgba(229, 9, 20, 0.05);
        }

        /* LOGO */

        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo h1 {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 3px;
            color: #ffffff;
        }

        .logo span {
            color: var(--red);
        }

        /* TITLE */

        .title {
            text-align: center;

            font-size: 25px;
            font-weight: 700;

            margin-bottom: 10px;
        }

        .description {
            text-align: center;

            color: var(--gray);

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 28px;
        }

        /* FORM */

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            color: var(--gray-light);

            font-size: 14px;
            font-weight: 600;

            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;

            left: 15px;
            top: 50%;

            transform: translateY(-50%);

            color: #777777;

            font-size: 15px;

            pointer-events: none;
        }

        input {
            width: 100%;

            height: 50px;

            padding: 0 15px 0 43px;

            background: #111111;

            border: 1px solid #333333;

            border-radius: 9px;

            outline: none;

            color: #ffffff;

            font-size: 15px;

            transition:
                border-color 0.2s,
                box-shadow 0.2s,
                background 0.2s;
        }

        input::placeholder {
            color: #666666;
        }

        input:hover {
            border-color: #444444;
        }

        input:focus {
            background: #141414;

            border-color: var(--red);

            box-shadow:
                0 0 0 3px rgba(229, 9, 20, 0.12);
        }

        /* BUTTON */

        button {
            width: 100%;

            height: 50px;

            border: none;

            border-radius: 9px;

            background: var(--red);

            color: #ffffff;

            font-size: 14px;

            font-weight: 800;

            letter-spacing: 0.5px;

            cursor: pointer;

            transition:
                background 0.2s,
                transform 0.15s,
                box-shadow 0.2s,
                opacity 0.2s;
        }

        button:hover {
            background: var(--red-light);

            box-shadow:
                0 8px 25px rgba(229, 9, 20, 0.25);

            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* MESSAGE */

        #message {
            display: none;

            margin-top: 18px;

            padding: 13px 14px;

            border-radius: 8px;

            font-size: 13px;

            line-height: 1.5;

            word-break: break-word;
        }

        .message-success {
            background: rgba(229, 9, 20, 0.08);

            color: #ff7777;

            border: 1px solid rgba(229, 9, 20, 0.35);
        }

        .message-error {
            background: rgba(229, 9, 20, 0.12);

            color: #ff5555;

            border: 1px solid rgba(229, 9, 20, 0.45);
        }

        /* BACK LINK */

        .back-link {
            display: block;

            margin-top: 25px;

            text-align: center;

            color: #888888;

            text-decoration: none;

            font-size: 14px;

            transition: color 0.2s;
        }

        .back-link:hover {
            color: #ff1a1a;
        }

        /* SECURITY */

        .security {
            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid #222222;

            text-align: center;

            color: #555555;

            font-size: 11px;

            line-height: 1.6;
        }

        /* MOBILE */

        @media (max-width: 480px) {

            body {
                padding: 15px;
            }

            .card {
                padding: 32px 22px;
                border-radius: 15px;
            }

            .logo h1 {
                font-size: 27px;
                letter-spacing: 2px;
            }

            .title {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <section class="card">

            <!-- RAPTORA LOGO -->
            <div class="logo">
                <h1>RAPTORA<span>.</span></h1>
            </div>


            <!-- TITLE -->
            <h2 class="title">
                Forgot Password?
            </h2>


            <!-- DESCRIPTION -->
            <p class="description">
                Enter the email address associated with
                your Raptora account and we'll send you
                a link to reset your password.
            </p>


            <!-- FORGOT PASSWORD FORM -->
            <form
                id="forgotPasswordForm"
                novalidate
            >

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            ✉
                        </span>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <!-- BUTTON -->
                <button
                    type="submit"
                    id="resetButton"
                >
                    Send Reset Link
                </button>


                <!-- RESPONSE MESSAGE -->
                <div
                    id="message"
                    role="alert"
                    aria-live="polite"
                ></div>

            </form>


            <!-- BACK TO LOGIN -->
            <a
                href="login.html"
                class="back-link"
            >
                ← Back to Login
            </a>


            <!-- SECURITY MESSAGE -->
            <div class="security">
                For your security, we never reveal whether
                an email address is registered with Raptora.
            </div>

        </section>

    </main>


    <script>

        /*
        ==========================================
        RAPTORA FORGOT PASSWORD
        ==========================================
        */

        const API_URL =
            "https://raptora-website.onrender.com";


        document.addEventListener(
            "DOMContentLoaded",
            () => {

                const form =
                    document.getElementById(
                        "forgotPasswordForm"
                    );

                const emailInput =
                    document.getElementById(
                        "email"
                    );

                const message =
                    document.getElementById(
                        "message"
                    );

                const button =
                    document.getElementById(
                        "resetButton"
                    );


                /*
                ==========================================
                CHECK REQUIRED ELEMENTS
                ==========================================
                */

                if (!form) {
                    console.error(
                        "Raptora: forgotPasswordForm not found."
                    );
                    return;
                }

                if (!emailInput) {
                    console.error(
                        "Raptora: email input not found."
                    );
                    return;
                }

                if (!message) {
                    console.error(
                        "Raptora: message element not found."
                    );
                    return;
                }

                if (!button) {
                    console.error(
                        "Raptora: reset button not found."
                    );
                    return;
                }


                /*
                ==========================================
                MESSAGE FUNCTION
                ==========================================
                */

                function showMessage(
                    text,
                    type
                ) {

                    message.style.display =
                        "block";

                    message.textContent =
                        text;

                    message.className =
                        type === "success"
                            ? "message-success"
                            : "message-error";
                }


                /*
                ==========================================
                FORM SUBMIT
                ==========================================
                */

                form.addEventListener(
                    "submit",
                    async (event) => {

                        event.preventDefault();


                        const email =
                            emailInput.value.trim();


                        /*
                        ==================================
                        VALIDATE EMAIL
                        ==================================
                        */

                        if (!email) {

                            showMessage(
                                "Please enter your email address.",
                                "error"
                            );

                            emailInput.focus();

                            return;
                        }


                        const emailPattern =
                            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


                        if (
                            !emailPattern.test(
                                email
                            )
                        ) {

                            showMessage(
                                "Please enter a valid email address.",
                                "error"
                            );

                            emailInput.focus();

                            return;
                        }


                        /*
                        ==================================
                        LOADING
                        ==================================
                        */

                        button.disabled =
                            true;

                        button.textContent =
                            "Sending...";


                        showMessage(
                            "Sending reset link...",
                            "success"
                        );


                        try {

                            console.log(
                                "Raptora: sending password reset request..."
                            );


                            /*
                            ==============================
                            API REQUEST
                            ==============================
                            */

                            const response =
                                await fetch(

                                    `${API_URL}/api/auth/forgot-password`,

                                    {
                                        method:
                                            "POST",

                                        headers: {
                                            "Content-Type":
                                                "application/json",

                                            "Accept":
                                                "application/json"
                                        },

                                        body:
                                            JSON.stringify({
                                                email:
                                                    email
                                            })
                                    }
                                );


                            console.log(
                                "HTTP status:",
                                response.status
                            );


                            /*
                            ==============================
                            READ SERVER RESPONSE
                            ==============================
                            */

                            let data = {};

                            const contentType =
                                response.headers.get(
                                    "content-type"
                                );


                            if (
                                contentType &&
                                contentType.includes(
                                    "application/json"
                                )
                            ) {

                                data =
                                    await response.json();

                            } else {

                                const text =
                                    await response.text();

                                data = {
                                    message: text
                                };
                            }


                            console.log(
                                "Backend response:",
                                data
                            );


                            /*
                            ==============================
                            SERVER ERROR
                            ==============================
                            */

                            if (
                                !response.ok
                            ) {

                                throw new Error(

                                    data.message ||
                                    `Server error (${response.status})`

                                );
                            }


                            /*
                            ==============================
                            SUCCESS
                            ==============================
                            */

                            showMessage(

                                data.message ||

                                "If an account exists with this email, a password reset link has been sent. Please check your inbox and spam folder.",

                                "success"
                            );


                            emailInput.value =
                                "";


                        } catch (error) {

                            console.error(
                                "Raptora Forgot Password Error:",
                                error
                            );


                            /*
                            ==============================
                            CONNECTION ERROR
                            ==============================
                            */

                            if (
                                error.name ===
                                "TypeError"
                            ) {

                                showMessage(
                                    "Unable to connect to Raptora. Please try again.",
                                    "error"
                                );

                            } else {

                                showMessage(

                                    error.message ||

                                    "Unable to send reset link. Please try again.",

                                    "error"
                                );
                            }


                        } finally {

                            /*
                            ==============================
                            RESTORE BUTTON
                            ==============================
                            */

                            button.disabled =
                                false;

                            button.textContent =
                                "Send Reset Link";
                        }

                    }
                );

            }
        );

    </script>

</body>
</html>
