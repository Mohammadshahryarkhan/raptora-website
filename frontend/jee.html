<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Raptora | JEE Rank Predictor</title>

<link rel="stylesheet" href="css/jee.css">

</head>


<body>


<div class="container">


<div class="card">


<h1>JEE Rank Predictor</h1>

<p>Predict your college chances through JoSAA counselling</p>



<label>JEE Main Marks</label>

<input 
type="number"
id="marks"
placeholder="Enter marks out of 300">



<label>Category</label>

<select id="category">

<option value="General">General</option>
<option value="OBC-NCL">OBC-NCL</option>
<option value="EWS">EWS</option>
<option value="SC">SC</option>
<option value="ST">ST</option>

</select>



<label>Quota</label>

<select id="quota">

<option value="OS">Other State</option>
<option value="HS">Home State</option>

</select>



<button onclick="predictRank()">

Predict Colleges

</button>



<div id="result"></div>



</div>

</div>





<script>


async function predictRank(){


let marks = document.getElementById("marks").value;

let category = document.getElementById("category").value;

let quota = document.getElementById("quota").value;



if(marks === ""){

alert("Enter JEE marks");

return;

}



let rank;



if(marks >= 280){

rank = 100;

}

else if(marks >= 250){

rank = 5000;

}

else if(marks >= 200){

rank = 15000;

}

else if(marks >= 150){

rank = 50000;

}

else{

rank = 120000;

}





try{


const response = await fetch(

"https://raptora-website-1.onrender.com/api/josaa/predict",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

rank: rank,

category: category,

quota: quota

})

}

);



const data = await response.json();



console.log("Server Response:", data);



if(!response.ok){

throw new Error(data.message || "Prediction failed");

}




let output = `

<h2>Prediction Result</h2>

<p>Expected Rank: ${rank}</p>

<h3>Eligible Colleges</h3>

`;





if(!data.data || data.data.length === 0){


output += `

<p>No colleges found</p>

`;


}

else{


data.data.forEach(college=>{


output += `

<div class="college">

<h3>🏛 ${college.college}</h3>

<p>📚 Branch: ${college.branch}</p>

<p>Category: ${college.category}</p>

<p>Closing Rank: ${college.closingRank}</p>

</div>

`;


});


}





document.getElementById("result").innerHTML = output;



}



catch(error){


console.log("Error:", error);


document.getElementById("result").innerHTML = `

<h3>Backend Error</h3>

<p>${error.message}</p>

`;



}



}



</script>



</body>

</html>
