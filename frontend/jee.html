<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raptora | JEE Rank & JoSAA College Predictor</title>
    <link rel="stylesheet" href="css/jee.css">
</head>

<body>

    <div class="container">
        <div class="card">

            <h1>JEE Rank & JoSAA Predictor</h1>
            <p>Predict your seat allocation across NITs, IIITs & GFTIs</p>

            <label for="marks">JEE Main Score (out of 300)</label>
            <input type="number" id="marks" min="0" max="300" placeholder="Enter NTA Marks out of 300">

            <label for="board">Class 12th Board Percentage (%)</label>
            <input type="number" id="board" min="0" max="100" placeholder="Enter Class 12 aggregate %">

            <label for="category">Category</label>
            <select id="category">
                <option value="General">General (OPEN)</option>
                <option value="OBC-NCL">OBC-NCL</option>
                <option value="EWS">EWS</option>
                <option value="SC">SC</option>
                <option value="ST">ST</option>
            </select>

            <label for="quota">Quota Type</label>
            <select id="quota">
                <option value="OS">Other State (OS)</option>
                <option value="HS">Home State (HS)</option>
            </select>

            <label for="gender">Gender Pool</label>
            <select id="gender">
                <option value="Gender-Neutral">Gender-Neutral</option>
                <option value="Female-Only">Female Supernumerary</option>
            </select>

            <label for="branch">Preferred Branch Group</label>
            <select id="branch">
                <option value="ALL">All Branches</option>
                <option value="CSE">Computer Science / IT / AI & ML</option>
                <option value="ECE">Electronics & Electrical (ECE/EEE)</option>
                <option value="MECH">Mechanical / Civil / Chemical</option>
            </select>

            <button onclick="predictRank()">
                Predict Eligible Colleges
            </button>

            <div id="result"></div>

        </div>
    </div>

    <script>
        /**
         * JoSAA Category Expansion Factors for Cutoffs
         */
        const CATEGORY_FACTOR = {
            "General": 1.0,
            "EWS": 1.25,
            "OBC-NCL": 1.35,
            "SC": 2.2,
            "ST": 2.6
        };

        const QUOTA_FACTOR = {
            "OS": 1.0,
            "HS": 1.3  // Home state quota relaxes cutoff ranks for NITs
        };

        const GENDER_FACTOR = {
            "Gender-Neutral": 1.0,
            "Female-Only": 1.25 // Supernumerary seats expand cutoffs for female candidates
        };

        /**
         * Real-World General Rank Estimates for JEE Main Marks (out of 300)
         */
        function calculateCRL(marks) {
            if (marks >= 280) return 500;
            if (marks >= 250) return 2500;
            if (marks >= 220) return 6000;
            if (marks >= 190) return 14000;
            if (marks >= 160) return 28000;
            if (marks >= 130) return 50000;
            if (marks >= 100) return 90000;
            if (marks >= 75)  return 150000;
            if (marks >= 50)  return 250000;
            return 400000;
        }

        /**
         * Database of Top JoSAA Institutes with OPEN Gender-Neutral General Ranks
         */
        const JOSAA_DATABASE = [
            { name: "NIT Trichy (Tiruchirappalli)", type: "NIT", cse: 1500, ece: 4500, mech: 16000 },
            { name: "NIT Surathkal (Karnataka)", type: "NIT", cse: 2200, ece: 6000, mech: 19000 },
            { name: "NIT Warangal", type: "NIT", cse: 2800, ece: 7000, mech: 21000 },
            { name: "MNNIT Allahabad", type: "NIT", cse: 4500, ece: 9500, mech: 27000 },
            { name: "VNIT Nagpur", type: "NIT", cse: 6500, ece: 14000, mech: 34000 },
            { name: "IIIT Hyderabad (Lateral/JEE Main)", type: "IIIT", cse: 2000, ece: 4200, mech: 999999 },
            { name: "IIIT Allahabad", type: "IIIT", cse: 5500, ece: 11000, mech: 999999 },
            { name: "IIIT Bangalore", type: "IIIT", cse: 7500, ece: 13500, mech: 999999 },
            { name: "NIT Rourkela", type: "NIT", cse: 3800, ece: 8800, mech: 24000 },
            { name: "NIT Calicut", type: "NIT", cse: 5000, ece: 10500, mech: 30000 },
            { name: "BIT Mesra (Ranchi)", type: "GFTI", cse: 16000, ece: 28000, mech: 55000 },
            { name: "PEC Chandigarh", type: "GFTI", cse: 14000, ece: 25000, mech: 48000 },
            { name: "IIIT Lucknow", type: "IIIT", cse: 11000, ece: 18000, mech: 999999 },
            { name: "IIIT Jabalpur", type: "IIIT", cse: 15000, ece: 24000, mech: 45000 },
            { name: "NIT Jalandhar", type: "NIT", cse: 12000, ece: 22000, mech: 42000 },
            { name: "NIT Silchar", type: "NIT", cse: 18000, ece: 31000, mech: 52000 },
            { name: "NIT Durgapur", type: "NIT", cse: 13500, ece: 23000, mech: 44000 },
            { name: "GFTI JNU Delhi", type: "GFTI", cse: 24000, ece: 38000, mech: 65000 },
            { name: "Assam University, Silchar", type: "GFTI", cse: 52000, ece: 75000, mech: 120000 }
        ];

        function checkJoSAAEligibility(boardPercent, category) {
            // JoSAA mandatory rule: Min 75% for General/OBC/EWS and 65% for SC/ST
            const minRequired = (category === "SC" || category === "ST") ? 65 : 75;
            return {
                isEligible: boardPercent >= minRequired,
                minRequired: minRequired
            };
        }

        function getEligibleColleges(crl, category, quota, gender, selectedBranch) {
            const catMult = CATEGORY_FACTOR[category] || 1.0;
            const quotaMult = QUOTA_FACTOR[quota] || 1.0;
            const genderMult = GENDER_FACTOR[gender] || 1.0;

            const totalMultiplier = catMult * quotaMult * genderMult;
            let results = [];

            JOSAA_DATABASE.forEach(inst => {
                const cseCutoff = Math.round(inst.cse * totalMultiplier);
                const eceCutoff = Math.round(inst.ece * totalMultiplier);
                const mechCutoff = Math.round(inst.mech * totalMultiplier);

                let matchedBranches = [];

                if ((selectedBranch === "ALL" || selectedBranch === "CSE") && crl <= cseCutoff && inst.cse < 999999) {
                    matchedBranches.push({ branch: "Computer Science & Engineering (CSE / IT)", closingRank: cseCutoff });
                }
                if ((selectedBranch === "ALL" || selectedBranch === "ECE") && crl <= eceCutoff && inst.ece < 999999) {
                    matchedBranches.push({ branch: "Electronics & Communication (ECE / EEE)", closingRank: eceCutoff });
                }
                if ((selectedBranch === "ALL" || selectedBranch === "MECH") && crl <= mechCutoff && inst.mech < 999999) {
                    matchedBranches.push({ branch: "Mechanical / Civil / Chemical", closingRank: mechCutoff });
                }

                if (matchedBranches.length > 0) {
                    results.push({
                        college: inst.name,
                        type: inst.type,
                        branches: matchedBranches
                    });
                }
            });

            return results;
        }

        async function predictRank() {
            const marksVal = document.getElementById("marks").value;
            const boardVal = document.getElementById("board").value;
            const category = document.getElementById("category").value;
            const quota = document.getElementById("quota").value;
            const gender = document.getElementById("gender").value;
            const selectedBranch = document.getElementById("branch").value;

            if (marksVal === "") {
                alert("Please enter your JEE Main marks.");
                return;
            }

            if (boardVal === "") {
                alert("Please enter your Class 12 Board Percentage.");
                return;
            }

            const marks = Number(marksVal);
            const boardPercent = Number(boardVal);

            if (marks < 0 || marks > 300) {
                alert("JEE Main Marks should be between 0 and 300.");
                return;
            }

            // 1. Verify 75% JoSAA Eligibility Rule
            const eligibility = checkJoSAAEligibility(boardPercent, category);
            if (!eligibility.isEligible) {
                document.getElementById("result").innerHTML = `
                    <div style="border: 2px solid #e74c3c; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: left;">
                        <h2 style="color: #e74c3c; margin-top: 0;">⚠️ JoSAA Ineligibility Alert</h2>
                        <p>According to JoSAA guidelines, candidates must score at least <strong>${eligibility.minRequired}%</strong> aggregate in Class 12 board exams for <strong>${category}</strong> category admission to NITs/IIITs/GFTIs.</p>
                        <p>Your entered board score: <strong>${boardPercent}%</strong></p>
                    </div>
                `;
                return;
            }

            const estimatedCRL = calculateCRL(marks);

            document.getElementById("result").innerHTML = "<p>⏳ Calculating JoSAA Category Ranks and fetching eligible colleges...</p>";

            try {
                // Backend API call
                const response = await fetch("https://raptora-website-1.onrender.com/api/josaa/predict", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        rank: estimatedCRL,
                        category: category,
                        quota: quota,
                        gender: gender,
                        branch: selectedBranch
                    })
                });

                const data = await response.json();

                if (response.ok && data.data && data.data.length > 0) {
                    renderBackendResults(data.data, estimatedCRL, category, quota, gender, selectedBranch);
                } else {
                    const localData = getEligibleColleges(estimatedCRL, category, quota, gender, selectedBranch);
                    renderLocalResults(localData, estimatedCRL, category, quota, gender, selectedBranch);
                }

            } catch (error) {
                console.warn("Backend offline or failing. Switching to local JoSAA engine:", error);
                const localData = getEligibleColleges(estimatedCRL, category, quota, gender, selectedBranch);
                renderLocalResults(localData, estimatedCRL, category, quota, gender, selectedBranch);
            }
        }

        function renderLocalResults(colleges, crl, category, quota, gender, branch) {
            let html = `
                <h2>Prediction Result</h2>
                <p><strong>Estimated Common Rank List (CRL):</strong> ~${crl.toLocaleString()}</p>
                <p><strong>Counselling Filters:</strong> Category: ${category} | Quota: ${quota} | Pool: ${gender} | Branch: ${branch}</p>
                <hr>
                <h3>Eligible JoSAA Colleges (${colleges.length} Found)</h3>
            `;

            if (colleges.length === 0) {
                html += `<p>No matching colleges found for this rank under your selected filters. Try broadening your branch choice.</p>`;
            } else {
                colleges.forEach(item => {
                    html += `
                        <div class="college" style="border: 1px solid #ddd; padding: 12px; margin-bottom: 12px; border-radius: 6px; text-align: left;">
                            <h3 style="margin-top:0;">🏛 ${item.college} <span style="font-size: 12px; color: #666;">(${item.type})</span></h3>
                            <ul style="margin: 5px 0; padding-left: 20px;">
                                ${item.branches.map(b => `<li><strong>${b.branch}</strong> (Expected Cutoff Rank: ~${b.closingRank.toLocaleString()})</li>`).join('')}
                            </ul>
                        </div>
                    `;
                });
            }

            document.getElementById("result").innerHTML = html;
        }

        function renderBackendResults(colleges, crl, category, quota, gender, branch) {
            let html = `
                <h2>Prediction Result</h2>
                <p><strong>Estimated CRL Rank:</strong> ~${crl.toLocaleString()}</p>
                <p><strong>Counselling Filters:</strong> ${category} | Quota: ${quota} | Pool: ${gender} | Branch: ${branch}</p>
                <hr>
                <h3>Eligible Colleges</h3>
            `;

            colleges.forEach(c => {
                html += `
                    <div class="college" style="border: 1px solid #ddd; padding: 12px; margin-bottom: 10px; border-radius: 6px; text-align: left;">
                        <h3>🏛 ${c.college}</h3>
                        <p>📚 <strong>Branch:</strong> ${c.branch}</p>
                        <p>Category / Quota: ${c.category || category} (${quota})</p>
                        <p>Closing Rank: ${c.closingRank}</p>
                    </div>
                `;
            });

            document.getElementById("result").innerHTML = html;
        }
    </script>

</body>

</html>
