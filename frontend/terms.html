<!-- ================================
     AGREE & RETURN TO REGISTER
================================ -->

<section class="agreement-card">

    <div class="agreement-icon">
        <i class="fa-solid fa-file-signature"></i>
    </div>

    <div class="agreement-content">

        <h2>Agree to Terms & Conditions</h2>

        <label class="agreement-checkbox">

            <input
                type="checkbox"
                id="agreeTerms">

            <span class="custom-checkbox"></span>

            <span class="agreement-text">
                I have read and agree to Raptora's
                <strong>Terms & Conditions</strong>.
            </span>

        </label>

        <p class="agreement-note">
            Tick the checkbox to accept the Terms & Conditions
            and return to the registration page.
        </p>

    </div>

</section>
