
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Raptora Admin</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #080808;
            color: white;
            min-height: 100vh;
        }

        header {
            background: #111;
            border-bottom: 1px solid #222;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #e50914;
            font-size: 26px;
            font-weight: bold;
        }

        .admin-label {
            color: #aaa;
            font-size: 14px;
        }

        main {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 30px;
        }

        .card {
            background: #121212;
            border: 1px solid #222;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .card h2 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 15px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            background: #080808;
            color: white;
            border: 1px solid #333;
            border-radius: 8px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #e50914;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 13px 20px;
            background: #e50914;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #c70812;
        }

        .secondary {
            background: #222;
        }

        .secondary:hover {
            background: #333;
        }

        .danger {
            background: #7d080f;
        }

        .danger:hover {
            background: #a50a13;
        }

        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .success {
            display: block;
            background: #123b1b;
            color: #8ff0a4;
        }

        .error {
            display: block;
            background: #3b1212;
            color: #ff8c8c;
        }

        .lists {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .user-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .user {
            background: #0b0b0b;
            border: 1px solid #222;
            border-radius: 10px;
            padding: 15px;
        }

        .user-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .user-email {
            color: #999;
            font-size: 14px;
        }

        .empty {
            color: #777;
            padding: 15px 0;
        }

        @media (max-width: 750px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .lists {
                grid-template-columns: 1fr;
            }

            header {
                padding: 18px;
            }

            main {
                margin-top: 25px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">RAPTORA</div>
    <div class="admin-label">Admin Dashboard</div>
</header>

<main>

    <h1>Mentor Management</h1>

    <p class="subtitle">
        Assign mentors to Raptora students.
    </p>


    <!-- ASSIGN MENTOR -->

    <div class="card">

        <h2>Assign Mentor</h2>

        <div class="form-grid">

            <input
                type="email"
                id="studentEmail"
                placeholder="Student email"
            >

            <input
                type="email"
                id="mentorEmail"
                placeholder="Mentor email"
            >

            <button onclick="assignMentor()">
                Assign Mentor
            </button>

        </div>

        <div id="status" class="status"></div>

    </div>


    <!-- REMOVE ASSIGNMENT -->

    <div class="card">

        <h2>Remove Mentor</h2>

        <div class="form-grid">

            <input
                type="email"
                id="removeStudentEmail"
                placeholder="Student email"
            >

            <div></div>

            <button
                class="danger"
                onclick="removeMentor()"
            >
                Remove Mentor
            </button>

        </div>

    </div>


    <!-- USERS -->

    <div class="lists">

        <div class="card">

            <h2>Students</h2>

            <div
                id="studentsList"
                class="user-list"
            >
                <div class="empty">
                    Loading students...
                </div>
            </div>

        </div>


        <div class="card">

            <h2>Mentors</h2>

            <div
                id="mentorsList"
                class="user-list"
            >
                <div class="empty">
                    Loading mentors...
                </div>
            </div>

        </div>

    </div>

</main>


<script>

const API_BASE_URL =
    "https://raptora-website.onrender.com";


// =====================================================
// GET TOKEN
// =====================================================

const token =
    localStorage.getItem("token");


// =====================================================
// CHECK LOGIN
// =====================================================

if (!token) {

    alert("Please login first.");

    window.location.href =
        "/login.html";

}


// =====================================================
// SHOW STATUS
// =====================================================

function showStatus(message, type) {

    const status =
        document.getElementById("status");

    status.textContent = message;

    status.className =
        "status " + type;

}


// =====================================================
// ASSIGN MENTOR
// =====================================================

async function assignMentor() {

    const studentEmail =
        document
            .getElementById("studentEmail")
            .value
            .trim();

    const mentorEmail =
        document
            .getElementById("mentorEmail")
            .value
            .trim();


    if (!studentEmail || !mentorEmail) {

        showStatus(
            "Enter both student and mentor email.",
            "error"
        );

        return;
    }


    try {

        const response =
            await fetch(
                `${API_BASE_URL}/api/mentors/assign-by-email`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${token}`
                    },

                    body: JSON.stringify({

                        studentEmail:
                            studentEmail,

                        mentorEmail:
                            mentorEmail

                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            showStatus(
                data.message ||
                "Unable to assign mentor.",
                "error"
            );

            return;
        }


        showStatus(
            `Mentor ${data.mentor.name} assigned to ${data.student.name}.`,
            "success"
        );


        document
            .getElementById("studentEmail")
            .value = "";

        document
            .getElementById("mentorEmail")
            .value = "";

    } catch (error) {

        console.error(error);

        showStatus(
            "Unable to connect to Raptora server.",
            "error"
        );
    }
}


// =====================================================
// REMOVE MENTOR
// =====================================================

async function removeMentor() {

    const studentEmail =
        document
            .getElementById("removeStudentEmail")
            .value
            .trim();


    if (!studentEmail) {

        showStatus(
            "Enter the student's email.",
            "error"
        );

        return;
    }


    try {

        const response =
            await fetch(
                `${API_BASE_URL}/api/mentors/remove-assignment`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${token}`
                    },

                    body: JSON.stringify({

                        studentEmail:
                            studentEmail

                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            showStatus(
                data.message ||
                "Unable to remove mentor.",
                "error"
            );

            return;
        }


        showStatus(
            "Mentor assignment removed successfully.",
            "success"
        );


        document
            .getElementById("removeStudentEmail")
            .value = "";

    } catch (error) {

        console.error(error);

        showStatus(
            "Unable to connect to Raptora server.",
            "error"
        );
    }
}


// =====================================================
// LOAD MENTORS
// =====================================================

async function loadMentors() {

    const container =
        document.getElementById("mentorsList");


    try {

        const response =
            await fetch(
                `${API_BASE_URL}/api/mentors/users`,
                {
                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            container.innerHTML =
                `<div class="empty">
                    ${data.message || "Unable to load mentors."}
                </div>`;

            return;
        }


        if (
            !data.mentors ||
            data.mentors.length === 0
        ) {

            container.innerHTML =
                `<div class="empty">
                    No mentor accounts found.
                </div>`;

            return;
        }


        container.innerHTML =
            data.mentors
                .map(mentor => `

                    <div class="user">

                        <div class="user-name">
                            ${escapeHtml(mentor.name)}
                        </div>

                        <div class="user-email">
                            ${escapeHtml(mentor.email)}
                        </div>

                    </div>

                `)
                .join("");

    } catch (error) {

        console.error(error);

        container.innerHTML =
            `<div class="empty">
                Unable to load mentors.
            </div>`;
    }
}


// =====================================================
// LOAD STUDENTS
// =====================================================

async function loadStudents() {

    const container =
        document.getElementById("studentsList");


    try {

        const response =
            await fetch(
                `${API_BASE_URL}/api/auth/users`,
                {
                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        if (!response.ok) {

            container.innerHTML =
                `<div class="empty">
                    Student list API not available yet.
                </div>`;

            return;
        }


        const data =
            await response.json();


        if (
            !data.users ||
            data.users.length === 0
        ) {

            container.innerHTML =
                `<div class="empty">
                    No students found.
                </div>`;

            return;
        }


        container.innerHTML =
            data.users
                .filter(user => user.role !== "mentor")
                .map(user => `

                    <div class="user">

                        <div class="user-name">
                            ${escapeHtml(user.name)}
                        </div>

                        <div class="user-email">
                            ${escapeHtml(user.email)}
                        </div>

                    </div>

                `)
                .join("");

    } catch (error) {

        console.error(error);

        container.innerHTML =
            `<div class="empty">
                Student list will be available after the admin users API is added.
            </div>`;
    }
}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


// =====================================================
// INITIAL LOAD
// =====================================================

loadMentors();

loadStudents();

</script>

</body>
</html>
