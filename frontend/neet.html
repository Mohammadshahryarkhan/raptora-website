<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Raptora | NEET MCC Predictor</title>

<link rel="stylesheet" href="css/neet.css">

</head>


<body>


<div class="container">


<div class="card">


<h1>NEET MCC College Predictor</h1>

<p>Predict Medical Colleges through MCC Counselling</p>



<label>NEET Marks</label>

<input 
type="number"
id="marks"
placeholder="Enter NEET Marks out of 720">



<label>Category</label>

<select id="category">

<option value="OPEN">General</option>

<option value="OBC">OBC</option>

<option value="EWS">EWS</option>

<option value="SC">SC</option>

<option value="ST">ST</option>

</select>



<label>Quota</label>

<select id="quota">

<option value="AIQ">
All India Quota (AIQ)
</option>

<option value="STATE">
State Quota
</option>

</select>



<button onclick="predictNEET()">

Predict Colleges

</button>



<div id="result"></div>



</div>

</div>




<script>


async function predictNEET(){


let marks = document.getElementById("marks").value;

let category = document.getElementById("category").value;

let quota = document.getElementById("quota").value;



if(marks===""){

alert("Enter NEET Marks");

return;

}



// Temporary marks to rank conversion

let rank;


if(marks>=700){

rank=100;

}

else if(marks>=650){

rank=5000;

}

else if(marks>=600){

rank=20000;

}

else if(marks>=550){

rank=50000;

}

else{

rank=100000;

}




try{


let response = await fetch(

"http://localhost:8000/api/mcc/predict",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

rank:rank,

category:category,

quota:quota

})


}

);



let data = await response.json();



let output = `

<h2>Prediction Result</h2>

<p>Expected Rank: ${rank}</p>

<h3>Eligible Medical Colleges</h3>

`;



if(!data.colleges || data.colleges.length===0){


output += "<p>No colleges found</p>";


}

else{


data.colleges.forEach(college=>{


output += `


<div class="college">


<h3>${college.college}</h3>


<p>

Course: ${college.course}

</p>


<p>

Closing Rank: ${college.closingRank}

</p>


<p>

Quota: ${college.quota}

</p>


</div>


`;


});


}



document.getElementById("result").innerHTML=output;



}


catch(error){


console.log(error);


alert("Backend connection failed");


}


}



</script>



</body>

</html>
