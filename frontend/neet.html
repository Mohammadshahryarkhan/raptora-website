<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEET UG 2026 College Predictor (MCC Compliant)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      padding: 30px 15px;
    }

    .container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 460px;
      padding: 35px;
      background: #111;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.5);
      border: 1px solid #ff0000;
    }

    .card h1 {
      text-align: center;
      color: #ff1a1a;
      margin-bottom: 8px;
    }

    .card p.subtitle {
      text-align: center;
      color: #ccc;
      margin-bottom: 25px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 8px;
      color: #ff4d4d;
      font-weight: 600;
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      background: #000;
      color: white;
      border: 1px solid #ff0000;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
    }

    input:focus,
    select:focus {
      box-shadow: 0 0 10px red;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      background: #ff0000;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #b30000;
      transform: scale(1.03);
    }

    #result {
      margin-top: 25px;
    }

    #result h2 {
      color: #ff1a1a;
      font-size: 20px;
      margin-bottom: 15px;
    }

    .college {
      background: #1a1a1a;
      border-left: 5px solid #ff0000;
      padding: 15px;
      margin-top: 15px;
      border-radius: 10px;
    }

    .college h3 {
      color: #ff3333;
      margin-bottom: 8px;
      font-size: 16px;
    }

    .college p {
      text-align: left;
      margin: 5px 0;
      color: white;
      font-size: 13px;
      line-height: 1.4;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      background: #330000;
      color: #ff6666;
      border: 1px solid #ff0000;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      margin-top: 5px;
    }

    .notice {
      font-size: 11px;
      color: #888;
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h1>NEET UG Predictor</h1>
    <p class="subtitle">MCC & State Counselling Rules Aligned</p>

    <form id="neetForm">
      <label for="score">NEET Score (Out of 720)</label>
      <input type="number" id="score" placeholder="e.g. 620" required min="0" max="720" />

      <label for="rank">All India Rank (AIR)</label>
      <input type="number" id="rank" placeholder="e.g. 15000" required min="1" max="2500000" />

      <label for="category">Category (Central / MCC)</label>
      <select id="category" required>
        <option value="UR">General / Unreserved (50th %tile)</option>
        <option value="EWS">EWS (50th %tile)</option>
        <option value="OBC">OBC-NCL (40th %tile)</option>
        <option value="SC">Scheduled Caste (40th %tile)</option>
        <option value="ST">Scheduled Tribe (40th %tile)</option>
      </select>

      <label for="quota">Counselling Quota</label>
      <select id="quota" required>
        <option value="AIQ">MCC 15% All India Quota (Govt Colleges)</option>
        <option value="CENTRAL">MCC 100% Central / AIIMS / JIPMER</option>
        <option value="STATE">85% State Domicile Quota</option>
        <option value="DEEMED">MCC 100% Deemed Universities (Management)</option>
      </select>

      <label for="course">Preferred Course</label>
      <select id="course" required>
        <option value="ALL">All Medical Courses</option>
        <option value="MBBS">MBBS (Medical)</option>
        <option value="BDS">BDS (Dental)</option>
        <option value="AYUSH">AYUSH (BAMS/BHMS)</option>
      </select>

      <button type="submit">Predict Medical Colleges</button>
    </form>

    <div id="result"></div>
    <p class="notice">*Qualifying thresholds & cutoffs adhere to official NTA percentile norms & MCC guidelines.</p>
  </div>
</div>

<script>
// Official MCC Percentile-based Qualifying Thresholds (Score out of 720)
const PERCENTILE_THRESHOLDS = {
  UR: 162,   // 50th Percentile (UR/General)
  EWS: 162,  // 50th Percentile (EWS)
  OBC: 127,  // 40th Percentile (OBC-NCL)
  SC: 127,   // 40th Percentile (SC)
  ST: 127    // 40th Percentile (ST)
};

// Database with explicit AIQ, Central, State, and Deemed cutoff closing ranks (AIR)
const neetColleges = [
  {
    name: "AIIMS New Delhi",
    location: "New Delhi",
    course: "MBBS",
    type: "Central",
    quotaCategory: "CENTRAL",
    cutoff: { UR: 57, EWS: 220, OBC: 250, SC: 980, ST: 2000 }
  },
  {
    name: "MAMC - Maulana Azad Medical College",
    location: "New Delhi",
    course: "MBBS",
    type: "Govt",
    quotaCategory: "AIQ",
    cutoff: { UR: 105, EWS: 350, OBC: 410, SC: 1850, ST: 4100 }
  },
  {
    name: "JIPMER Puducherry",
    location: "Puducherry",
    course: "MBBS",
    type: "Central",
    quotaCategory: "CENTRAL",
    cutoff: { UR: 277, EWS: 820, OBC: 890, SC: 3600, ST: 8200 }
  },
  {
    name: "Top AIIMS Group (Bhubaneswar/Jodhpur/Rishikesh)",
    location: "Various Campuses",
    course: "MBBS",
    type: "Central",
    quotaCategory: "CENTRAL",
    cutoff: { UR: 850, EWS: 1650, OBC: 1800, SC: 8100, ST: 15200 }
  },
  {
    name: "KGMU - King George's Medical University",
    location: "Lucknow, UP",
    course: "MBBS",
    type: "Govt",
    quotaCategory: "AIQ",
    cutoff: { UR: 1850, EWS: 2900, OBC: 3100, SC: 17500, ST: 34000 }
  },
  {
    name: "BMCRI - Bangalore Medical College",
    location: "Bengaluru, KA",
    course: "MBBS",
    type: "Govt",
    quotaCategory: "AIQ",
    cutoff: { UR: 1450, EWS: 2700, OBC: 2950, SC: 15800, ST: 29500 }
  },
  {
    name: "PMCH - Patna Medical College",
    location: "Patna, Bihar",
    course: "MBBS",
    type: "Govt",
    quotaCategory: "STATE",
    cutoff: { UR: 7200, EWS: 7800, OBC: 8100, SC: 52000, ST: 78000 }
  },
  {
    name: "Pan India Top Govt Medical Colleges (15% AIQ)",
    location: "Multiple States",
    course: "MBBS",
    type: "Govt AIQ",
    quotaCategory: "AIQ",
    cutoff: { UR: 22800, EWS: 23600, OBC: 23800, SC: 112000, ST: 142000 }
  },
  {
    name: "Maulana Azad Dental College (BDS)",
    location: "New Delhi",
    course: "BDS",
    type: "Govt Dental",
    quotaCategory: "AIQ",
    cutoff: { UR: 28500, EWS: 31200, OBC: 32500, SC: 128000, ST: 168000 }
  },
  {
    name: "Kasturba Medical College (KMC Manipal) - Deemed",
    location: "Manipal, KA",
    course: "MBBS",
    type: "Deemed Private",
    quotaCategory: "DEEMED",
    cutoff: { UR: 51000, EWS: 51000, OBC: 51000, SC: 51000, ST: 51000 }
  },
  {
    name: "Hamdard Institute of Medical Sciences (HIMSR) - Deemed",
    location: "New Delhi",
    course: "MBBS",
    type: "Deemed Private",
    quotaCategory: "DEEMED",
    cutoff: { UR: 58000, EWS: 58000, OBC: 58000, SC: 58000, ST: 58000 }
  },
  {
    name: "Top Deemed Universities (Management Quota)",
    location: "Pan India",
    course: "MBBS",
    type: "Deemed Private",
    quotaCategory: "DEEMED",
    cutoff: { UR: 600000, EWS: 600000, OBC: 600000, SC: 600000, ST: 600000 }
  },
  {
    name: "National Institute of Ayurveda (BAMS)",
    location: "Jaipur, RJ",
    course: "AYUSH",
    type: "AYUSH Govt",
    quotaCategory: "AIQ",
    cutoff: { UR: 64000, EWS: 69000, OBC: 71000, SC: 205000, ST: 275000 }
  }
];

document.getElementById('neetForm').addEventListener('submit', function(e) {
  e.preventDefault();

  const score = parseInt(document.getElementById('score').value);
  const rank = parseInt(document.getElementById('rank').value);
  const category = document.getElementById('category').value;
  const quota = document.getElementById('quota').value;
  const coursePref = document.getElementById('course').value;
  const resultDiv = document.getElementById('result');

  // 1. MCC Eligibility Check (NTA Percentile Rule)
  const minRequiredScore = PERCENTILE_THRESHOLDS[category];

  if (score < minRequiredScore) {
    resultDiv.innerHTML = `
      <h2>Counseling Eligibility Status</h2>
      <div class="college">
        <h3>Not Qualified for MCC/State Counselling</h3>
        <p>Your Score: <strong>${score}/720</strong></p>
        <p>Minimum qualifying score for <strong>${category}</strong> category is <strong>${minRequiredScore}</strong> (per NTA cutoff percentiles).</p>
        <p>You must meet the percentile cutoff to participate in MCC AIQ or State quota seat allotments.</p>
      </div>
    `;
    return;
  }

  // 2. Filter Colleges by Quota, Course, and Category Closing Ranks
  let matched = [];

  neetColleges.forEach(col => {
    // Filter course preference
    if (coursePref !== 'ALL' && col.course !== coursePref) return;

    // Filter quota type mapping
    if (quota === 'AIQ' && col.quotaCategory !== 'AIQ') return;
    if (quota === 'CENTRAL' && col.quotaCategory !== 'CENTRAL') return;
    if (quota === 'STATE' && col.quotaCategory !== 'STATE' && col.quotaCategory !== 'AIQ') return;
    if (quota === 'DEEMED' && col.quotaCategory !== 'DEEMED') return;

    // Fetch cutoff rank for candidate's category
    const categoryCutoffRank = col.cutoff[category] || col.cutoff['UR'];

    // Grant 10% buffer window for Round 2 / Mop-up / Stray Vacancy round shifts
    const effectiveCutoff = Math.round(categoryCutoffRank * 1.10);

    if (rank <= effectiveCutoff) {
      matched.push({
        name: col.name,
        location: col.location,
        course: col.course,
        type: col.type,
        cutoffRank: categoryCutoffRank
      });
    }
  });

  // 3. Render Output Results
  if (matched.length === 0) {
    resultDiv.innerHTML = `
      <h2>Prediction Results</h2>
      <div class="college">
        <h3>No Seat Allotment Match</h3>
        <p>No options matched for AIR <strong>${rank}</strong> under selected filters.</p>
        <p><strong>Suggestion:</strong> Try selecting <em>'MCC 100% Deemed Universities'</em> or changing course preferences (BDS/AYUSH).</p>
      </div>
    `;
    return;
  }

  let html = `<h2>Predicted Options (${matched.length})</h2>`;
  matched.forEach(col => {
    html += `
      <div class="college">
        <h3>${col.name}</h3>
        <p><strong>Course:</strong> ${col.course}</p>
        <p><strong>Location:</strong> ${col.location}</p>
        <p><strong>Estimated Closing AIR:</strong> ~${col.cutoffRank}</p>
        <span class="badge">${col.type}</span>
      </div>
    `;
  });

  resultDiv.innerHTML = html;
});
</script>

</body>
</html>
