<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEET UG 2026 Predictor & MCC Counselling Engine</title>
  <style>
    :root {
      --bg-dark: #050505;
      --card-bg: #0f0f12;
      --card-inner: #18181c;
      --accent-red: #ff2e4d;
      --accent-red-hover: #e11d48;
      --accent-red-glow: rgba(255, 46, 77, 0.35);
      --text-main: #f8fafc;
      --text-sub: #a1a1aa;
      --border: #27272a;
      --border-red: #450a0a;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 30px 15px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 980px;
    }

    .hero-banner {
      background: linear-gradient(135deg, #0f0f12 0%, #1a0507 100%);
      border: 1px solid var(--border-red);
      border-radius: 16px;
      padding: 28px 20px;
      text-align: center;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(255, 46, 77, 0.12);
    }

    .hero-banner h1 {
      font-size: 26px;
      color: var(--accent-red);
      letter-spacing: -0.5px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .hero-banner p {
      color: var(--text-sub);
      font-size: 13px;
      margin-top: 6px;
    }

    .badge-year {
      display: inline-block;
      background: rgba(255, 46, 77, 0.15);
      color: var(--accent-red);
      border: 1px solid var(--accent-red-glow);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .panel-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    @media (max-width: 680px) {
      .grid-2 { 
        grid-template-columns: 1fr; 
      }
    }

    .input-field {
      margin-bottom: 18px;
    }

    .input-field label {
      display: block;
      margin-bottom: 6px;
      color: var(--accent-red);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .input-field input, .input-field select {
      width: 100%;
      padding: 12px 14px;
      background: #09090b;
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-field input:focus, .input-field select:focus {
      border-color: var(--accent-red);
      box-shadow: 0 0 0 3px var(--accent-red-glow);
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
      margin-bottom: 18px;
      background: #09090b;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .checkbox-container input {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--accent-red);
    }

    .checkbox-container label {
      font-size: 13px;
      color: var(--text-sub);
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--accent-red), var(--accent-red-hover));
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--accent-red-glow);
    }

    .btn-print {
      background: var(--card-inner);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: border-color 0.2s;
    }

    .btn-print:hover { 
      border-color: var(--accent-red); 
    }

    #outputSection { 
      margin-top: 30px; 
    }

    .dashboard-header {
      background: #09090b;
      border: 1px solid var(--border-red);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .stats-flex {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 14px;
    }

    @media (max-width: 600px) {
      .stats-flex { 
        grid-template-columns: 1fr; 
      }
    }

    .stat-card {
      background: var(--card-inner);
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      text-align: center;
    }

    .stat-card .value {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent-red);
    }

    .stat-card .label {
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 4px;
      text-transform: uppercase;
    }

    .rules-box {
      background: var(--card-inner);
      border-left: 4px solid var(--accent-red);
      border-radius: 0 10px 10px 0;
      padding: 14px 18px;
      margin-bottom: 20px;
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--text-sub);
    }

    .rules-box ul {
      margin-left: 18px;
      margin-top: 6px;
    }

    .college-item {
      background: #09090b;
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent-red);
      border-radius: 10px;
      padding: 18px;
      margin-top: 14px;
      transition: border-color 0.2s, transform 0.2s;
    }

    .college-item:hover {
      border-color: var(--accent-red);
      transform: translateY(-2px);
    }

    .college-item h3 {
      color: var(--text-main);
      font-size: 16px;
      margin-bottom: 6px;
    }

    .college-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
      font-size: 13px;
      color: var(--text-sub);
    }

    @media (max-width: 600px) {
      .college-info-grid { 
        grid-template-columns: 1fr; 
      }
    }

    .pill-group {
      margin-top: 12px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .pill {
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .pill-govt { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .pill-aiq { background: rgba(255, 46, 77, 0.15); color: var(--accent-red); border: 1px solid var(--accent-red-glow); }
    .pill-deemed { background: rgba(245, 158, 11, 0.15); color: #fde68a; border: 1px solid rgba(245, 158, 11, 0.3); }
    .pill-high { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
    .pill-med { background: rgba(245, 158, 11, 0.2); color: #fef08a; }

    .disclaimer-text {
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 24px;
      text-align: center;
      line-height: 1.5;
    }

    @media print {
      body { background: #fff; color: #000; padding: 0; }
      .hero-banner, .panel-card, #outputSection { box-shadow: none; border: none; }
      .btn-submit, .btn-print, .checkbox-container { display: none; }
      .stat-card, .college-item { border: 1px solid #ccc; background: #fff; color: #000; }
      .college-item h3, .hero-banner h1, .stat-card .value { color: #000; }
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="hero-banner">
    <span class="badge-year">MCC 2026 Rules & Percentile Verified</span>
    <h1>NEET UG 2026 Allocation Matrix</h1>
    <p>Real-Time AIR Projection, State Quota Benchmarks & Institutional Eligibility</p>
  </div>

  <div class="panel-card">
    <form id="predictorForm">
      <div class="grid-2">
        <div class="input-field">
          <label for="marks">NEET 2026 Score (Out of 720)</label>
          <input type="number" id="marks" placeholder="Enter Score (e.g. 660)" min="0" max="720" required />
        </div>

        <div class="input-field">
          <label for="category">Reservation Category</label>
          <select id="category" required>
            <option value="UR">General / Unreserved (UR)</option>
            <option value="EWS">Gen-EWS (10% Central Quota)</option>
            <option value="OBC">OBC-NCL (27% Central Quota)</option>
            <option value="SC">Scheduled Caste (15% Central Quota)</option>
            <option value="ST">Scheduled Tribe (7.5% Central Quota)</option>
          </select>
        </div>
      </div>

      <div class="grid-2">
        <div class="input-field">
          <label for="domicile">State Domicile (85% State Quota)</label>
          <select id="domicile" required>
            <option value="BIHAR">Bihar (85% SQ)</option>
            <option value="UP">Uttar Pradesh (85% SQ)</option>
            <option value="RAJASTHAN">Rajasthan (85% SQ)</option>
            <option value="KARNATAKA">Karnataka (85% SQ)</option>
            <option value="OTHER">Other States / UTs</option>
          </select>
        </div>

        <div class="input-field">
          <label for="quota">Counselling Quota Scheme</label>
          <select id="quota" required>
            <option value="ALL">All Schemes Combined</option>
            <option value="AIQ">MCC 15% All India Quota (AIQ)</option>
            <option value="CENTRAL">MCC Central Institutes (AIIMS / JIPMER / BHU / AMU)</option>
            <option value="STATE">85% State Domicile Quota (SQ)</option>
            <option value="DEEMED">MCC 100% Deemed Universities</option>
          </select>
        </div>
      </div>

      <div class="grid-2">
        <div class="input-field">
          <label for="branch">Course Discipline</label>
          <select id="branch" required>
            <option value="ALL">All Disciplines (MBBS / BDS / AYUSH)</option>
            <option value="MBBS">MBBS (Bachelor of Medicine & Surgery)</option>
            <option value="BDS">BDS (Dental Surgery)</option>
            <option value="AYUSH">AYUSH (BAMS / BHMS)</option>
          </select>
        </div>

        <div class="input-field">
          <label for="round">Target Counselling Round</label>
          <select id="round" required>
            <option value="R1">Round 1 (Free Exit Allowed)</option>
            <option value="R2">Round 2 (Upgradation Allowed / R1 Seat Auto-Vacates)</option>
            <option value="R3">Round 3 (Forfeiture Rules Apply on Resignation)</option>
            <option value="STRAY">Stray Vacancy Round (Strict No-Exit Clause)</option>
          </select>
        </div>
      </div>

      <div class="checkbox-container">
        <input type="checkbox" id="pwd" />
        <label for="pwd">Persons with Benchmark Disabilities (PwBD - 5% Horizontal Quota via 16 Designated MCC Boards)</label>
      </div>

      <button type="submit" class="btn-submit">Generate Complete Allocation Matrix</button>
    </form>

    <div id="outputSection"></div>

    <p class="disclaimer-text">
      *Allocations computed based on NTA Percentile Metrics, NMC Guidelines, and MCC 2026 Information Bulletin regulations.
    </p>
  </div>
</div>

<script>
const QUALIFYING_BENCHMARKS = {
  UR: 137, EWS: 137, OBC: 107, SC: 107, ST: 107,
  UR_PWD: 121, RESERVED_PWD: 107
};

function calculateAIR(marks) {
  if (marks >= 715) return { min: 1, max: 20, mid: 10, percentile: "99.999" };
  if (marks >= 700) return { min: 21, max: 250, mid: 130, percentile: "99.980" };
  if (marks >= 680) return { min: 251, max: 1800, mid: 1000, percentile: "99.850" };
  if (marks >= 660) return { min: 1801, max: 5500, mid: 3600, percentile: "99.500" };
  if (marks >= 640) return { min: 5501, max: 13000, mid: 9200, percentile: "98.900" };
  if (marks >= 620) return { min: 13001, max: 24000, mid: 18500, percentile: "97.800" };
  if (marks >= 600) return { min: 24001, max: 42000, mid: 33000, percentile: "96.200" };
  if (marks >= 550) return { min: 42001, max: 85000, mid: 63000, percentile: "92.000" };
  if (marks >= 500) return { min: 85001, max: 150000, mid: 117000, percentile: "86.000" };
  if (marks >= 400) return { min: 150001, max: 260000, mid: 205000, percentile: "74.000" };
  if (marks >= 300) return { min: 260001, max: 420000, mid: 340000, percentile: "58.000" };
  return { min: 420001, max: 900000, mid: 660000, percentile: "35.000" };
}

const collegeDatabase = [
  { name: "AIIMS, New Delhi", branch: "MBBS", type: "Central", quota: "CENTRAL", state: "ALL", fee: "₹1,628 / Year", cutoff: { UR: 57, EWS: 220, OBC: 250, SC: 980, ST: 2000 } },
  { name: "Maulana Azad Medical College (MAMC), Delhi", branch: "MBBS", type: "Govt AIQ", quota: "AIQ", state: "ALL", fee: "₹4,445 / Year", cutoff: { UR: 105, EWS: 350, OBC: 410, SC: 1850, ST: 4100 } },
  { name: "JIPMER, Puducherry", branch: "MBBS", type: "Central", quota: "CENTRAL", state: "ALL", fee: "₹12,620 / Year", cutoff: { UR: 277, EWS: 820, OBC: 890, SC: 3600, ST: 8200 } },
  { name: "VMMCH & Safdarjung Hospital, New Delhi", branch: "MBBS", type: "Central", quota: "CENTRAL", state: "ALL", fee: "₹13,500 / Year", cutoff: { UR: 140, EWS: 410, OBC: 520, SC: 2300, ST: 4800 } },
  { name: "Top Tier AIIMS (Bhopal / Jodhpur / Rishikesh)", branch: "MBBS", type: "Central", quota: "CENTRAL", state: "ALL", fee: "₹5,856 / Year", cutoff: { UR: 850, EWS: 1650, OBC: 1800, SC: 8100, ST: 15200 } },
  { name: "Tier 2 AIIMS (Patna / Raipur / Deoghar)", branch: "MBBS", type: "Central", quota: "CENTRAL", state: "ALL", fee: "₹5,856 / Year", cutoff: { UR: 2800, EWS: 3900, OBC: 4200, SC: 28000, ST: 45000 } },
  { name: "King George's Medical University (KGMU), Lucknow", branch: "MBBS", type: "Govt AIQ", quota: "AIQ", state: "ALL", fee: "₹54,600 / Year", cutoff: { UR: 1850, EWS: 2900, OBC: 3100, SC: 17500, ST: 34000 } },
  { name: "Bangalore Medical College (BMCRI), Bengaluru", branch: "MBBS", type: "Govt AIQ", quota: "AIQ", state: "ALL", fee: "₹60,000 / Year", cutoff: { UR: 1450, EWS: 2700, OBC: 2950, SC: 15800, ST: 29500 } },
  { name: "Pan-India Govt Medical Colleges (AIQ Closing)", branch: "MBBS", type: "Govt AIQ", quota: "AIQ", state: "ALL", fee: "₹10,000 - ₹90,000 / Year", cutoff: { UR: 23500, EWS: 24200, OBC: 24500, SC: 115000, ST: 145000 } },
  { name: "Patna Medical College (PMCH), Patna", branch: "MBBS", type: "Govt State", quota: "STATE", state: "BIHAR", fee: "₹21,200 / Year", cutoff: { UR: 7200, EWS: 7800, OBC: 8100, SC: 52000, ST: 78000 } },
  { name: "IGIMS / NMCH Patna (State Quota)", branch: "MBBS", type: "Govt State", quota: "STATE", state: "BIHAR", fee: "₹25,000 - ₹1,20,000 / Year", cutoff: { UR: 14500, EWS: 15800, OBC: 16200, SC: 88000, ST: 110000 } },
  { name: "GSVM Medical College, Kanpur", branch: "MBBS", type: "Govt State", quota: "STATE", state: "UP", fee: "₹36,000 / Year", cutoff: { UR: 8500, EWS: 9200, OBC: 9600, SC: 68000, ST: 125000 } },
  { name: "SMS Medical College, Jaipur", branch: "MBBS", type: "Govt State", quota: "STATE", state: "RAJASTHAN", fee: "₹50,500 / Year", cutoff: { UR: 1200, EWS: 2100, OBC: 2300, SC: 14000, ST: 21000 } },
  { name: "Maulana Azad Institute of Dental Sciences, Delhi", branch: "BDS", type: "Govt Dental", quota: "AIQ", state: "ALL", fee: "₹4,120 / Year", cutoff: { UR: 28500, EWS: 31200, OBC: 32500, SC: 128000, ST: 168000 } },
  { name: "Kasturba Medical College (KMC), Manipal", branch: "MBBS", type: "Deemed Private", quota: "DEEMED", state: "ALL", fee: "₹17.8 Lakhs / Year", cutoff: { UR: 51000, EWS: 51000, OBC: 51000, SC: 51000, ST: 51000 } }
];

document.getElementById('predictorForm').addEventListener('submit', function(e) {
  e.preventDefault();

  const marks = parseInt(document.getElementById('marks').value);
  const category = document.getElementById('category').value;
  const domicile = document.getElementById('domicile').value;
  const quota = document.getElementById('quota').value;
  const preferredBranch = document.getElementById('branch').value;
  const targetRound = document.getElementById('round').value;
  const isPwd = document.getElementById('pwd').checked;
  const outputDiv = document.getElementById('outputSection');

  let reqCutoff = QUALIFYING_BENCHMARKS[category];
  if (isPwd) reqCutoff = category === 'UR' ? QUALIFYING_BENCHMARKS.UR_PWD : QUALIFYING_BENCHMARKS.RESERVED_PWD;

  if (marks < reqCutoff) {
    outputDiv.innerHTML = `
      <div class="college-item" style="border-left-color: var(--danger);">
        <h3 style="color: var(--danger);">NEET 2026 Status: Below Qualifying Threshold</h3>
        <p style="margin-top:4px;">Your Score: <strong>${marks} / 720</strong></p>
        <p style="margin-top:6px; font-size:13px; color:var(--text-sub);">The minimum qualifying threshold for <strong>${category} ${isPwd ? '(PwD)' : ''}</strong> is approximately <strong>${reqCutoff}</strong> marks.</p>
      </div>
    `;
    return;
  }

  const rankData = calculateAIR(marks);

  let matches = collegeDatabase.filter(col => {
    if (preferredBranch !== 'ALL' && col.branch !== preferredBranch) return false;
    if (quota === 'AIQ' && col.quota !== 'AIQ') return false;
    if (quota === 'CENTRAL' && col.quota !== 'CENTRAL') return false;
    if (quota === 'STATE' && col.quota !== 'STATE') return false;
    if (quota === 'DEEMED' && col.quota !== 'DEEMED') return false;
    if (col.quota === 'STATE' && col.state !== domicile) return false;

    let baseCutoff = col.cutoff[category] || col.cutoff['UR'];
    if (isPwd) baseCutoff = Math.round(baseCutoff * 3.2);

    return rankData.mid <= baseCutoff;
  });

  let html = `
    <div class="dashboard-header">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 style="color: var(--accent-red); font-size: 18px;">2026 Projection Matrix</h2>
        <button class="btn-print" onclick="window.print()">Export Report PDF</button>
      </div>
      <div class="stats-flex">
        <div class="stat-card">
          <div class="value">${rankData.min.toLocaleString()} - ${rankData.max.toLocaleString()}</div>
          <div class="label">Predicted AIR</div>
        </div>
        <div class="stat-card">
          <div class="value">${rankData.percentile}%</div>
          <div class="label">Percentile</div>
        </div>
        <div class="stat-card">
          <div class="value">${matches.length}</div>
          <div class="label">Matching Institutions</div>
        </div>
      </div>
    </div>

    <div class="rules-box">
      <strong style="color:var(--text-main);">Official MCC 2026 Counselling Guidelines:</strong>
      <ul>
        <li><strong>Round 1 Free Exit:</strong> Candidates can exit freely without forfeiting security deposits.</li>
        <li><strong>Upgradation Clause:</strong> If upgraded in Round 2 or Round 3, the seat allotted in the preceding round is automatically cancelled and transferred.</li>
        <li><strong>Round 3 Resignation Penalty:</strong> Seat resignation after joining in Round 3 results in security deposit forfeiture and disqualification from Stray Vacancy rounds.</li>
        <li><strong>Disability Evaluation:</strong> Certificates must be generated from one of the 16 MCC-recognized Disability Assessment Boards.</li>
      </ul>
    </div>

    <h3 style="color: var(--accent-red); font-size: 16px; margin-bottom: 12px;">Allocated Options Matrix (${targetRound})</h3>
  `;

  if (matches.length === 0) {
    html += `
      <div class="college-item" style="border-left-color: var(--warning);">
        <h3 style="color: var(--warning);">No Seats Matched for Selected Inputs</h3>
        <p style="font-size:13px; color:var(--text-sub); margin-top:4px;">Predicted AIR ~${rankData.mid.toLocaleString()} exceeds opening cutoffs for selected options.</p>
      </div>
    `;
  } else {
    matches.forEach(col => {
      let baseCutoff = col.cutoff[category] || col.cutoff['UR'];
      if (isPwd) baseCutoff = Math.round(baseCutoff * 3.2);
      const isHighChance = rankData.mid <= Math.round(baseCutoff * 0.85);

      html += `
        <div class="college-item">
          <h3>${col.name}</h3>
          <div class="college-info-grid">
            <div><strong>Discipline:</strong> ${col.branch}</div>
            <div><strong>Approx. Annual Fee:</strong> ${col.fee}</div>
            <div><strong>Historical Closing Rank:</strong> AIR ~${baseCutoff.toLocaleString()}</div>
            <div><strong>Quota Scheme:</strong> ${col.quota}</div>
          </div>
          <div class="pill-group">
            <span class="pill ${col.quota === 'DEEMED' ? 'pill-deemed' : 'pill-govt'}">${col.type}</span>
            <span class="pill ${isHighChance ? 'pill-high' : 'pill-med'}">${isHighChance ? 'High Probability' : 'Borderline / Competitive'}</span>
          </div>
        </div>
      `;
    });
  }

  outputDiv.innerHTML = html;
});
</script>

</body>
</html>
