<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raptora | NEET MCC Medical College Predictor</title>
    <link rel="stylesheet" href="css/neet.css">
</head>

<body>

    <div class="container">
        <div class="card">

            <h1>NEET MCC Medical College Predictor</h1>
            <p>Based on Official MCC NEET-UG All India Quota & Deemed Counselling Cutoffs</p>

            <label for="marks">NEET Score (out of 720)</label>
            <input type="number" id="marks" min="0" max="720" placeholder="Enter NEET Score (0-720)">

            <label for="category">Category</label>
            <select id="category">
                <option value="OPEN">General (OPEN)</option>
                <option value="OBC">OBC-NCL</option>
                <option value="EWS">EWS</option>
                <option value="SC">SC</option>
                <option value="ST">ST</option>
            </select>

            <label for="quota">Quota / Seat Type</label>
            <select id="quota">
                <option value="AIQ">All India Quota (15% AIQ)</option>
                <option value="AIIMS">AIIMS / JIPMER</option>
                <option value="CENTRAL">Central Universities (BHU / AMU / DU)</option>
                <option value="DEEMED">Deemed / Management Quota</option>
            </select>

            <label for="course">Preferred Course</label>
            <select id="course">
                <option value="ALL">All Medical Courses</option>
                <option value="MBBS">MBBS (Bachelor of Medicine & Surgery)</option>
                <option value="BDS">BDS (Bachelor of Dental Surgery)</option>
                <option value="AYUSH">BAMS / BHMS / BUMS (AYUSH)</option>
                <option value="NURSING">B.Sc. Nursing (MCC Central)</option>
            </select>

            <button onclick="predictNEET()">
                Predict Eligible Colleges
            </button>

            <div id="result"></div>

        </div>
    </div>

    <script>
        /**
         * Category Rank Expansion Multipliers for MCC All India Quota
         */
        const CATEGORY_FACTOR = {
            "OPEN": 1.0,
            "EWS": 1.15,
            "OBC": 1.20,
            "SC": 4.5,
            "ST": 6.0
        };

        const QUOTA_FACTOR = {
            "AIQ": 1.0,
            "AIIMS": 0.85,    // Highly competitive
            "CENTRAL": 1.1,
            "DEEMED": 8.0     // Very high rank cutoffs due to high fee structure
        };

        /**
         * Realistic NEET Score vs All India Rank (AIR) Mapping (Out of 720)
         */
        function calculateNeetRank(marks) {
            if (marks >= 710) return 100;
            if (marks >= 690) return 700;
            if (marks >= 670) return 2500;
            if (marks >= 650) return 7000;
            if (marks >= 630) return 14000;
            if (marks >= 610) return 24000;
            if (marks >= 580) return 40000;
            if (marks >= 550) return 65000;
            if (marks >= 500) return 110000;
            if (marks >= 450) return 170000;
            if (marks >= 400) return 240000;
            if (marks >= 300) return 420000;
            return 700000;
        }

        /**
         * Database of MCC Participating Medical Institutions
         */
        const MCC_DATABASE = [
            { name: "AIIMS New Delhi", quotaType: "AIIMS", mbbs: 60, bds: 999999, ayush: 999999, nursing: 1500 },
            { name: "Maulana Azad Medical College (MAMC), New Delhi", quotaType: "AIQ", mbbs: 120, bds: 4000, ayush: 999999, nursing: 999999 },
            { name: "VMMCI & Safdarjung Hospital, New Delhi", quotaType: "AIQ", mbbs: 180, bds: 5500, ayush: 999999, nursing: 999999 },
            { name: "JIPMER, Puducherry", quotaType: "AIIMS", mbbs: 250, bds: 999999, ayush: 999999, nursing: 999999 },
            { name: "BHU (Institute of Medical Sciences), Varanasi", quotaType: "CENTRAL", mbbs: 900, bds: 12000, ayush: 25000, nursing: 999999 },
            { name: "AIIMS Bhubaneswar", quotaType: "AIIMS", mbbs: 600, bds: 999999, ayush: 999999, nursing: 999999 },
            { name: "AIIMS Jodhpur", quotaType: "AIIMS", mbbs: 550, bds: 999999, ayush: 999999, nursing: 999999 },
            { name: "King George's Medical University (KGMU), Lucknow", quotaType: "AIQ", mbbs: 1500, bds: 18000, ayush: 999999, nursing: 999999 },
            { name: "Grant Medical College, Mumbai", quotaType: "AIQ", mbbs: 2800, bds: 22000, ayush: 999999, nursing: 999999 },
            { name: "Madras Medical College, Chennai", quotaType: "AIQ", mbbs: 3200, bds: 25000, ayush: 999999, nursing: 999999 },
            { name: "AIIMS Patna", quotaType: "AIIMS", mbbs: 1800, bds: 999999, ayush: 999999, nursing: 8000 },
            { name: "Government Medical College (GMC), Chandigarh", quotaType: "AIQ", mbbs: 1200, bds: 999999, ayush: 999999, nursing: 999999 },
            { name: "AMU (Aligarh Muslim University)", quotaType: "CENTRAL", mbbs: 3500, bds: 28000, ayush: 45000, nursing: 999999 },
            { name: "Patna Medical College (PMCH), Patna", quotaType: "AIQ", mbbs: 4500, bds: 32000, ayush: 999999, nursing: 999999 },
            { name: "Kasturba Medical College (KMC), Manipal", quotaType: "DEEMED", mbbs: 45000, bds: 150000, ayush: 999999, nursing: 999999 },
            { name: "Hamdard Institute of Medical Sciences (HIMSR), Delhi", quotaType: "DEEMED", mbbs: 55000, bds: 180000, ayush: 999999, nursing: 999999 },
            { name: "Dr. D.Y. Patil Medical College, Pune", quotaType: "DEEMED", mbbs: 250000, bds: 450000, ayush: 999999, nursing: 999999 }
        ];

        function getEligibleColleges(air, category, quota, selectedCourse) {
            const catMult = CATEGORY_FACTOR[category] || 1.0;
            const quotaMult = QUOTA_FACTOR[quota] || 1.0;
            const totalMultiplier = catMult * quotaMult;

            let results = [];

            MCC_DATABASE.forEach(item => {
                const mbbsCutoff = Math.round(item.mbbs * totalMultiplier);
                const bdsCutoff = Math.round(item.bds * totalMultiplier);
                const ayushCutoff = Math.round(item.ayush * totalMultiplier);
                const nursingCutoff = Math.round(item.nursing * totalMultiplier);

                let matchedCourses = [];

                if ((selectedCourse === "ALL" || selectedCourse === "MBBS") && air <= mbbsCutoff && item.mbbs < 999999) {
                    matchedCourses.push({ course: "MBBS", closingRank: mbbsCutoff });
                }
                if ((selectedCourse === "ALL" || selectedCourse === "BDS") && air <= bdsCutoff && item.bds < 999999) {
                    matchedCourses.push({ course: "BDS (Dental)", closingRank: bdsCutoff });
                }
                if ((selectedCourse === "ALL" || selectedCourse === "AYUSH") && air <= ayushCutoff && item.ayush < 999999) {
                    matchedCourses.push({ course: "BAMS / BHMS / BUMS", closingRank: ayushCutoff });
                }
                if ((selectedCourse === "ALL" || selectedCourse === "NURSING") && air <= nursingCutoff && item.nursing < 999999) {
                    matchedCourses.push({ course: "B.Sc. Nursing", closingRank: nursingCutoff });
                }

                if (matchedCourses.length > 0) {
                    results.push({
                        college: item.name,
                        quotaType: item.quotaType,
                        courses: matchedCourses
                    });
                }
            });

            return results;
        }

        async function predictNEET() {
            const marksVal = document.getElementById("marks").value;
            const category = document.getElementById("category").value;
            const quota = document.getElementById("quota").value;
            const selectedCourse = document.getElementById("course").value;

            if (marksVal === "") {
                alert("Please enter your NEET Score.");
                return;
            }

            const marks = Number(marksVal);

            if (marks < 0 || marks > 720) {
                alert("NEET Score must be between 0 and 720.");
                return;
            }

            const estimatedAIR = calculateNeetRank(marks);

            document.getElementById("result").innerHTML = "<p>⏳ Calculating NEET All India Rank (AIR) and querying MCC cutoffs...</p>";

            try {
                // Request to backend API
                const response = await fetch("https://raptora-website-1.onrender.com/api/mcc/predict", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        rank: estimatedAIR,
                        category: category,
                        quota: quota,
                        course: selectedCourse
                    })
                });

                const data = await response.json();

                if (response.ok && data.data && data.data.length > 0) {
                    renderBackendResults(data.data, estimatedAIR, category, quota, selectedCourse);
                } else {
                    const localData = getEligibleColleges(estimatedAIR, category, quota, selectedCourse);
                    renderLocalResults(localData, estimatedAIR, category, quota, selectedCourse);
                }

            } catch (error) {
                console.warn("Backend API offline. Using built-in MCC predictor database:", error);
                const localData = getEligibleColleges(estimatedAIR, category, quota, selectedCourse);
                renderLocalResults(localData, estimatedAIR, category, quota, selectedCourse);
            }
        }

        function renderLocalResults(colleges, air, category, quota, course) {
            let html = `
                <h2>Prediction Result</h2>
                <p><strong>Estimated All India Rank (AIR):</strong> ~${air.toLocaleString()}</p>
                <p><strong>Filters Applied:</strong> Category: ${category} | Quota: ${quota} | Course: ${course}</p>
                <hr>
                <h3>Eligible Medical Colleges (${colleges.length} Found)</h3>
            `;

            if (colleges.length === 0) {
                html += `<p>No eligible medical colleges found under these criteria. Try adjusting the course or quota selection.</p>`;
            } else {
                colleges.forEach(item => {
                    html += `
                        <div class="college" style="border: 1px solid #ddd; padding: 12px; margin-bottom: 12px; border-radius: 6px; text-align: left;">
                            <h3 style="margin-top:0;">🏥 ${item.college} <span style="font-size: 12px; color: #666;">(${item.quotaType})</span></h3>
                            <ul style="margin: 5px 0; padding-left: 20px;">
                                ${item.courses.map(c => `<li><strong>${c.course}</strong> (Expected Cutoff AIR: ~${c.closingRank.toLocaleString()})</li>`).join('')}
                            </ul>
                        </div>
                    `;
                });
            }

            document.getElementById("result").innerHTML = html;
        }

        function renderBackendResults(colleges, air, category, quota, course) {
            let html = `
                <h2>Prediction Result</h2>
                <p><strong>Estimated All India Rank (AIR):</strong> ~${air.toLocaleString()}</p>
                <p><strong>Filters Applied:</strong> ${category} | Quota: ${quota} | Course: ${course}</p>
                <hr>
                <h3>Eligible Colleges</h3>
            `;

            colleges.forEach(c => {
                html += `
                    <div class="college" style="border: 1px solid #ddd; padding: 12px; margin-bottom: 10px; border-radius: 6px; text-align: left;">
                        <h3>🏥 ${c.college}</h3>
                        <p>🩺 <strong>Course:</strong> ${c.course || course}</p>
                        <p>Quota: ${c.quota || quota} | Category: ${c.category || category}</p>
                        <p>Closing AIR Rank: ${c.closingRank}</p>
                    </div>
                `;
            });

            document.getElementById("result").innerHTML = html;
        }
    </script>

</body>

</html>
