<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Raptora | KCET Predictor</title>

<link rel="stylesheet" href="css/kcet.css">

</head>


<body>


<div class="container">

<div class="card">


<h1>KCET College Predictor</h1>

<p>Based on KEA Counselling Cutoff</p>


<label>KCET Marks (out of 180)</label>

<input 
type="number"
id="marks"
placeholder="Enter KCET Marks">


<label>PUC PCM Percentage</label>

<input 
type="number"
id="puc"
placeholder="Enter PCM Percentage">


<label>Category</label>

<select id="category">

<option value="GM">GM</option>
<option value="2A">2A</option>
<option value="2B">2B</option>
<option value="3A">3A</option>
<option value="3B">3B</option>
<option value="SC">SC</option>
<option value="ST">ST</option>

</select>


<label>Region</label>

<select id="region">

<option value="Non-HK">Non-HK</option>
<option value="HK">HK</option>

</select>



<button onclick="predictKCET()">

Predict Colleges

</button>


<div id="result"></div>


</div>

</div>




<script>


function calculateRank(marks){


let rank;


if(marks >=160){

rank = 500;

}

else if(marks >=140){

rank = 5000;

}

else if(marks >=120){

rank = 15000;

}

else if(marks >=100){

rank = 40000;

}

else{

rank = 80000;

}


return rank;

}




async function predictKCET(){


let marks=document.getElementById("marks").value;

let puc=document.getElementById("puc").value;

let category=document.getElementById("category").value;

let region=document.getElementById("region").value;



if(marks==="" || puc===""){

alert("Enter KCET Marks and PUC Percentage");

return;

}



let rank=calculateRank(Number(marks));



try{


const response = await fetch(

"http://localhost:8000/api/kcet/predict",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

rank:rank,

category:category,

region:region

})


}

);



const data=await response.json();



let output=`

<h2>Prediction Result</h2>

<p>Expected KCET Rank: ${rank}</p>

`;



if(!data.colleges || data.colleges.length===0){


output +=

"<p>No colleges found for this rank.</p>";


}

else{


data.colleges.forEach(college=>{


output += `

<div class="college">

<h3>🏛 ${college.college}</h3>

<p>📚 ${college.branch}</p>

<p>Category: ${college.category}</p>

<p>Closing Rank: ${college.closingRank}</p>

</div>

`;


});


}



document.getElementById("result").innerHTML=output;



}

catch(error){


console.log(error);

alert("Backend connection failed");


}


}


</script>


</body>

</html>
