<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raptora | KCET Predictor</title>
    <link rel="stylesheet" href="css/kcet.css">
</head>

<body>

    <div class="container">
        <div class="card">

            <h1>KCET College Predictor</h1>
            <p>Based on KEA Counselling Cutoff</p>

            <label for="marks">KCET Marks (out of 180)</label>
            <input type="number" id="marks" min="0" max="180" placeholder="Enter KCET Marks">

            <label for="puc">PUC PCM Percentage</label>
            <input type="number" id="puc" min="0" max="100" placeholder="Enter PCM Percentage">

            <label for="category">Category</label>
            <select id="category">
                <option value="GM">GM</option>
                <option value="2A">2A</option>
                <option value="2B">2B</option>
                <option value="3A">3A</option>
                <option value="3B">3B</option>
                <option value="SC">SC</option>
                <option value="ST">ST</option>
            </select>

            <label for="region">Region</label>
            <select id="region">
                <option value="Non-HK">Non-HK</option>
                <option value="HK">HK</option>
            </select>

            <button onclick="predictKCET()">
                Predict Colleges
            </button>

            <div id="result"></div>

        </div>
    </div>

    <script>

        /**
         * Calculates expected KCET Rank based on
         * 50% Weightage KCET Score (out of 180) + 50% Weightage 2nd PUC PCM %
         */
        function calculateRank(kcetMarks, pucPercentage) {
            // Input range validation
            if (kcetMarks < 0 || kcetMarks > 180 || pucPercentage < 0 || pucPercentage > 100) {
                return null;
            }

            // Calculate 50:50 composite score out of 100
            const kcetWeight = (kcetMarks / 180) * 50;
            const pucWeight = (pucPercentage / 100) * 50;
            const compositeScore = kcetWeight + pucWeight;

            // Map composite score to expected KCET rank range
            let rank;

            if (compositeScore >= 95) {
                rank = 50;
            } else if (compositeScore >= 90) {
                rank = 500;
            } else if (compositeScore >= 85) {
                rank = 1500;
            } else if (compositeScore >= 80) {
                rank = 4000;
            } else if (compositeScore >= 75) {
                rank = 9000;
            } else if (compositeScore >= 70) {
                rank = 16000;
            } else if (compositeScore >= 65) {
                rank = 28000;
            } else if (compositeScore >= 60) {
                rank = 45000;
            } else if (compositeScore >= 50) {
                rank = 75000;
            } else {
                rank = 110000;
            }

            return rank;
        }

        async function predictKCET() {

            let marksVal = document.getElementById("marks").value;
            let pucVal = document.getElementById("puc").value;
            let category = document.getElementById("category").value;
            let region = document.getElementById("region").value;

            // Input check
            if (marksVal === "" || pucVal === "") {
                alert("Enter both KCET Marks and PUC Percentage");
                return;
            }

            let marks = Number(marksVal);
            let puc = Number(pucVal);

            // Boundary validations
            if (marks < 0 || marks > 180) {
                alert("KCET Marks must be between 0 and 180.");
                return;
            }
            if (puc < 0 || puc > 100) {
                alert("PUC Percentage must be between 0 and 100.");
                return;
            }

            let rank = calculateRank(marks, puc);

            if (rank === null) {
                alert("Invalid input parameters.");
                return;
            }

            // Show loading status
            document.getElementById("result").innerHTML = "<p>Predicting eligible colleges...</p>";

            try {

                const response = await fetch(
                    "https://raptora-website-1.onrender.com/api/kcet/predict",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            rank: rank,
                            category: category,
                            region: region
                        })
                    }
                );

                const data = await response.json();
                console.log("Server Response:", data);

                if (!response.ok) {
                    throw new Error(data.message || "API Error");
                }

                let output = `
                <h2>Prediction Result</h2>
                <p><strong>Expected KCET Rank:</strong> ~${rank.toLocaleString()}</p>
                `;

                if (!data.data || data.data.length === 0) {
                    output += `
                    <p>No colleges found for this rank and category combination.</p>
                    `;
                } else {
                    data.data.forEach(college => {
                        output += `
                        <div class="college">
                            <h3>🏛 ${college.college}</h3>
                            <p>📚 Branch: ${college.branch}</p>
                            <p>Category: ${college.category}</p>
                            <p>Region: ${college.region}</p>
                            <p>Closing Rank: ${college.closingRank}</p>
                        </div>
                        `;
                    });
                }

                document.getElementById("result").innerHTML = output;

            } catch (error) {

                console.log("Error:", error);

                document.getElementById("result").innerHTML = `
                <h3>Backend Error</h3>
                <p>${error.message}</p>
                `;

            }

        }

    </script>

</body>

</html>
