<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raptora | KCET Predictor</title>
    <link rel="stylesheet" href="css/kcet.css">
</head>

<body>

    <div class="container">
        <div class="card">

            <h1>KCET College Predictor</h1>
            <p>Based on KEA Counselling Cutoff</p>

            <label for="marks">KCET Marks (out of 180)</label>
            <input type="number" id="marks" min="0" max="180" placeholder="Enter KCET Marks">

            <label for="puc">PUC PCM Percentage</label>
            <input type="number" id="puc" min="0" max="100" placeholder="Enter PCM Percentage">

            <label for="category">Category</label>
            <select id="category">
                <option value="GM">GM (General Merit)</option>
                <option value="CAT-1">CAT-1</option>
                <option value="2A">2A</option>
                <option value="2B">2B</option>
                <option value="3A">3A</option>
                <option value="3B">3B</option>
                <option value="SC">SC</option>
                <option value="ST">ST</option>
            </select>

            <label for="region">Region</label>
            <select id="region">
                <option value="Non-HK">Non-HK (General Region)</option>
                <option value="HK">HK (371J Hyderabad-Karnataka)</option>
            </select>

            <button onclick="predictKCET()">
                Predict Colleges
            </button>

            <div id="result"></div>

        </div>
    </div>

    <script>
        /**
         * Top Karnataka Engineering Colleges Database mapped with KEA Cutoff trends
         */
        const TOP_COLLEGES = [
            { name: "R.V. College of Engineering (RVCE), Bangalore", cse: 800, ece: 2500, mech: 15000 },
            { name: "B.M.S. College of Engineering (BMSCE), Bangalore", cse: 2000, ece: 6000, mech: 25000 },
            { name: "M.S. Ramaiah Institute of Technology (MSRIT), Bangalore", cse: 2500, ece: 7000, mech: 30000 },
            { name: "PES University (Ring Road Campus), Bangalore", cse: 3000, ece: 8500, mech: 32000 },
            { name: "University Visvesvaraya College of Engineering (UVCE), Bangalore", cse: 3500, ece: 9000, mech: 28000 },
            { name: "Bangalore Institute of Technology (BIT), Bangalore", cse: 8000, ece: 16000, mech: 45000 },
            { name: "Dayananda Sagar College of Engineering (DSCE), Bangalore", cse: 9000, ece: 18000, mech: 50000 },
            { name: "Sir M. Visvesvaraya Institute of Technology (Sir MVIT), Bangalore", cse: 12000, ece: 24000, mech: 60000 },
            { name: "Siddaganga Institute of Technology (SIT), Tumkur", cse: 13000, ece: 25000, mech: 65000 },
            { name: "BMS Institute of Technology & Management (BMSIT), Bangalore", cse: 15000, ece: 28000, mech: 70000 },
            { name: "Nitte Meenakshi Institute of Technology (NMIT), Bangalore", cse: 16000, ece: 30000, mech: 75000 },
            { name: "JSS Science and Technology University (SJCE), Mysuru", cse: 5000, ece: 12000, mech: 35000 },
            { name: "New Horizon College of Engineering (NHCE), Bangalore", cse: 20000, ece: 35000, mech: 80000 },
            { name: "CMR Institute of Technology (CMRIT), Bangalore", cse: 22000, ece: 38000, mech: 85000 },
            { name: "REVA University, Bangalore", cse: 25000, ece: 42000, mech: 90000 }
        ];

        /**
         * Category & HK Reservation Cutoff Multipliers
         * Reserved categories and HK quota allow candidates to get higher-tier seats at relaxed general rank values.
         */
        const CATEGORY_RELAXATION = {
            "GM": 1.0,
            "CAT-1": 1.35,
            "2A": 1.20,
            "2B": 1.25,
            "3A": 1.12,
            "3B": 1.08,
            "SC": 2.50,
            "ST": 2.80
        };

        function calculateRank(kcetMarks, pucPercentage) {
            // 50:50 composite score formula (50% KCET + 50% PUC PCM %)
            const kcetWeight = (kcetMarks / 180) * 50;
            const pucWeight = (pucPercentage / 100) * 50;
            const compositeScore = kcetWeight + pucWeight;

            let rank;
            if (compositeScore >= 95) rank = 100;
            else if (compositeScore >= 90) rank = 600;
            else if (compositeScore >= 85) rank = 2000;
            else if (compositeScore >= 80) rank = 5000;
            else if (compositeScore >= 75) rank = 10000;
            else if (compositeScore >= 70) rank = 18000;
            else if (compositeScore >= 65) rank = 32000;
            else if (compositeScore >= 60) rank = 50000;
            else if (compositeScore >= 50) rank = 85000;
            else rank = 120000;

            return { rank, compositeScore };
        }

        function getLocalCollegeSuggestions(effectiveRank) {
            let suggestions = [];

            TOP_COLLEGES.forEach(col => {
                let branches = [];
                if (effectiveRank <= col.cse) branches.push("CSE / AI & ML / ISE");
                else if (effectiveRank <= col.ece) branches.push("ECE / EEE / Data Science");
                else if (effectiveRank <= col.mech) branches.push("Mechanical / Civil / Biotech");

                if (branches.length > 0) {
                    suggestions.push({
                        college: col.name,
                        branch: branches.join(", "),
                        closingRank: col.cse
                    });
                }
            });

            return suggestions;
        }

        async function predictKCET() {
            let marksVal = document.getElementById("marks").value;
            let pucVal = document.getElementById("puc").value;
            let category = document.getElementById("category").value;
            let region = document.getElementById("region").value;

            if (marksVal === "" || pucVal === "") {
                alert("Please enter both KCET Marks and PUC Percentage.");
                return;
            }

            let marks = Number(marksVal);
            let puc = Number(pucVal);

            if (marks < 0 || marks > 180 || puc < 0 || puc > 100) {
                alert("Invalid bounds! KCET Marks must be (0-180) & PUC Percentage (0-100%).");
                return;
            }

            // 1. Calculate base general rank based on composite score
            const rankData = calculateRank(marks, puc);
            const generalRank = rankData.rank;

            // 2. Account for Category Reservation & HK (371J) Quota relaxation
            const categoryMultiplier = CATEGORY_RELAXATION[category] || 1.0;
            const hkMultiplier = (region === "HK") ? 1.35 : 1.0;
            const totalQuotaMultiplier = categoryMultiplier * hkMultiplier;

            // Effective rank threshold for allotment potential
            const effectiveRank = Math.round(generalRank * totalQuotaMultiplier);

            document.getElementById("result").innerHTML = "<p>⏳ Calculating composite rank and fetching eligible colleges...</p>";

            try {
                // Send request to backend
                const response = await fetch(
                    "https://raptora-website-1.onrender.com/api/kcet/predict",
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            rank: generalRank,
                            effectiveRank: effectiveRank,
                            category: category,
                            region: region,
                            compositeScore: rankData.compositeScore.toFixed(2)
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "API Server Error");
                }

                let output = renderResultsHTML(data.data, generalRank, effectiveRank, category, region, rankData.compositeScore);
                document.getElementById("result").innerHTML = output;

            } catch (error) {
                console.warn("Backend API offline/error. Falling back to client database:", error);

                // Fallback to local college suggestions if backend API fails
                const localSuggestions = getLocalCollegeSuggestions(effectiveRank);
                let output = renderResultsHTML(localSuggestions, generalRank, effectiveRank, category, region, rankData.compositeScore);
                document.getElementById("result").innerHTML = output;
            }
        }

        function renderResultsHTML(collegeList, generalRank, effectiveRank, category, region, compositeScore) {
            let html = `
                <h2>Prediction Result</h2>
                <p><strong>Composite Score:</strong> ${compositeScore.toFixed(2)} / 100</p>
                <p><strong>General Merit Rank:</strong> ~${generalRank.toLocaleString()}</p>
                <p><strong>Category Allotment Potential Rank (${category} ${region === "HK" ? "+ 371J HK Quota" : ""}):</strong> ~${effectiveRank.toLocaleString()}</p>
                <hr>
                <h3>Eligible Colleges & Branches</h3>
            `;

            if (!collegeList || collegeList.length === 0) {
                html += `<p>No colleges found matching this rank and category combination.</p>`;
            } else {
                collegeList.forEach(college => {
                    html += `
                    <div class="college" style="border:1px solid #ccc; padding:10px; margin-bottom:10px; border-radius:6px;">
                        <h3>🏛 ${college.college || college.name}</h3>
                        <p>📚 <strong>Branch:</strong> ${college.branch}</p>
                        <p>🏷 <strong>Category Applied:</strong> ${category}</p>
                        <p>📍 <strong>Region:</strong> ${region}</p>
                    </div>
                    `;
                });
            }

            return html;
        }
    </script>

</body>

</html>
