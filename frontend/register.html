<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Raptora | Register</title>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="css/register.css">

</head>

<body>

<div class="container">

    <!-- ===========================
         LEFT PANEL
    ============================ -->

    <div class="left-panel">

        <div class="overlay">

            <h1>RAPTORA</h1>

            <p>
                Your Admission Journey, Reimagined by Raptora
            </p>

            <img
                src="register.png"
                alt="Raptora Register">

        </div>

    </div>


    <!-- ===========================
         RIGHT PANEL
    ============================ -->

    <div class="right-panel">

        <div class="register-box">

            <h2>Create Your Account</h2>

            <p>
                Start your journey with Raptora.
            </p>


            <form id="registerForm">

                <!-- FULL NAME -->

                <div class="input-group">

                    <label for="name">
                        Full Name
                    </label>

                    <div class="input-field">

                        <i class="fa-solid fa-user"></i>

                        <input
                            type="text"
                            id="name"
                            name="fullname"
                            placeholder="Enter your full name"
                            required>

                    </div>

                </div>


                <!-- USERNAME -->

                <div class="input-group">

                    <label for="username">
                        Username
                    </label>

                    <div class="input-field">

                        <i class="fa-solid fa-at"></i>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Choose a username"
                            required>

                    </div>

                </div>


                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <div class="input-field">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required>

                    </div>

                </div>


                <!-- PHONE -->

                <div class="input-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <div class="input-field">

                        <i class="fa-solid fa-phone"></i>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter phone number"
                            required>

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-field">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create password"
                            required>

                        <i
                            class="fa-solid fa-eye eye"
                            onclick="togglePassword('password')">
                        </i>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="input-field">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm password"
                            required>

                        <i
                            class="fa-solid fa-eye eye"
                            onclick="togglePassword('confirmPassword')">
                        </i>

                    </div>

                </div>


                <!-- ===========================
                     TERMS CHECKBOX
                ============================ -->

                <div class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        required>

                    <label for="terms">

                        I agree to Raptora's

                        <a
                            href="terms.html"
                            id="termsLink">

                            Terms & Conditions

                        </a>

                    </label>

                </div>


                <!-- CREATE ACCOUNT -->

                <button type="submit">

                    Create Account

                </button>

            </form>


            <!-- LOGIN -->

            <div class="login-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>

        </div>

    </div>

</div>


<!-- ===========================
     PASSWORD SCRIPT
============================ -->

<script>

function togglePassword(id) {

    const input = document.getElementById(id);

    if (input.type === "password") {

        input.type = "text";

    } else {

        input.type = "password";

    }

}


/* ==========================================
   CHECK IF TERMS WERE ACCEPTED
========================================== */

document.addEventListener("DOMContentLoaded", function () {

    const termsCheckbox =
        document.getElementById("terms");

    const termsAccepted =
        localStorage.getItem("raptoraTermsAccepted");

    if (termsAccepted === "true") {

        termsCheckbox.checked = true;

    }

});


/* ==========================================
   TERMS LINK
========================================== */

document.getElementById("termsLink").addEventListener("click", function () {

    /*
       Remember that the user came from
       the registration page.
    */

    localStorage.setItem(
        "raptoraTermsReturn",
        "true"
    );

});


/* ==========================================
   REGISTER FORM
========================================== */

document.getElementById("registerForm").addEventListener("submit", function (event) {

    if (!document.getElementById("terms").checked) {

        event.preventDefault();

        alert("Please agree to the Terms & Conditions before creating your account.");

        return;

    }

});

</script>


<script src="js/register.js"></script>

</body>

</html>
