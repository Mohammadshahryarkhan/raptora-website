<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>RAPTORA | Mentor Dashboard</title>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #080808;
        color: white;
    }

    .navbar {
        height: 70px;
        background: #111;
        border-bottom: 1px solid #252525;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 30px;
    }

    .logo {
        width: 45px;
        height: 45px;
        object-fit: contain;
    }

    .nav-title {
        color: #e50914;
        font-size: 21px;
        font-weight: bold;
    }

    .logout {
        background: #e50914;
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 7px;
        cursor: pointer;
    }

    .logout:hover {
        background: #c70710;
    }

    .dashboard {
        display: flex;
        height: calc(100vh - 70px);
    }

    /* ================================
       STUDENTS
    ================================= */

    .students {
        width: 300px;
        background: #101010;
        border-right: 1px solid #292929;
        overflow-y: auto;
    }

    .students h2 {
        padding: 20px;
        margin: 0;
        font-size: 20px;
    }

    .student {
        padding: 16px 20px;
        border-top: 1px solid #242424;
        cursor: pointer;
    }

    .student:hover,
    .student.active {
        background: #1d1d1d;
        border-left: 3px solid #e50914;
    }

    .student-name {
        font-weight: bold;
    }

    .student-email {
        color: #999;
        font-size: 13px;
        margin-top: 5px;
    }

    /* ================================
       CHAT
    ================================= */

    .chat {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
    }

    .chat-header {
        padding: 18px 22px;
        background: #111;
        border-bottom: 1px solid #292929;
    }

    .chat-header h2 {
        margin: 0;
        font-size: 18px;
    }

    .chat-header p {
        margin: 5px 0 0;
        color: #999;
        font-size: 13px;
    }

    .messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .empty {
        margin: auto;
        color: #777;
        text-align: center;
    }

    .message {
        max-width: 70%;
        padding: 11px 14px;
        border-radius: 12px;
        line-height: 1.4;
        word-break: break-word;
    }

    .message.student {
        align-self: flex-start;
        background: #1b1b1b;
        border: 1px solid #292929;
    }

    .message.mentor {
        align-self: flex-end;
        background: #e50914;
    }

    .message-time {
        display: block;
        font-size: 10px;
        opacity: .65;
        margin-top: 5px;
    }

    /* ================================
       ATTACHMENTS
    ================================= */

    .attachment-image {
        max-width: 300px;
        max-height: 300px;
        border-radius: 8px;
        margin-top: 8px;
        display: block;
        object-fit: cover;
    }

    .attachment-video {
        max-width: 320px;
        width: 100%;
        border-radius: 8px;
        margin-top: 8px;
    }

    .file-card {
        display: block;
        margin-top: 8px;
        padding: 11px;
        border-radius: 8px;
        background: rgba(0, 0, 0, .25);
        color: white;
        text-decoration: none;
        word-break: break-word;
    }

    .file-card:hover {
        background: rgba(0, 0, 0, .4);
    }

    .file-card i {
        margin-right: 8px;
    }

    .attachment-bar {
        min-height: 35px;
        padding: 6px 18px;
        color: #aaa;
        font-size: 13px;
        background: #111;
    }

    /* ================================
       MESSAGE COMPOSER
    ================================= */

    .composer {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        background: #111;
        border-top: 1px solid #292929;
    }

    .attach-button {
        width: 44px;
        height: 44px;
        border: none;
        border-radius: 50%;
        background: #222;
        color: white;
        cursor: pointer;
        font-size: 18px;
        flex-shrink: 0;
    }

    .attach-button:hover {
        background: #333;
    }

    #message-input {
        flex: 1;
        min-width: 0;
        background: #1b1b1b;
        border: 1px solid #333;
        color: white;
        border-radius: 22px;
        padding: 12px 16px;
        outline: none;
    }

    #message-input:focus {
        border-color: #e50914;
    }

    .send-button {
        width: 44px;
        height: 44px;
        border: none;
        border-radius: 50%;
        background: #e50914;
        color: white;
        cursor: pointer;
        font-size: 17px;
        flex-shrink: 0;
    }

    .send-button:hover {
        background: #c70710;
    }

    .send-button:disabled {
        opacity: .5;
        cursor: not-allowed;
    }

    #file-input {
        display: none;
    }

    @media (max-width: 700px) {

        .navbar {
            padding: 0 15px;
        }

        .students {
            width: 220px;
        }

        .message {
            max-width: 85%;
        }

        .nav-title {
            font-size: 17px;
        }

    }

</style>


</head>

<body>

<!-- =====================================================
     NAVBAR
===================================================== -->

<header class="navbar">


<div>

    <img
        src="frontend/register.png"
        class="logo"
        alt="Raptora">

</div>


<div class="nav-title">
    Mentor Dashboard
</div>


<button
    class="logout"
    onclick="logout()">

    Logout

</button>


</header>

<!-- =====================================================
     DASHBOARD
===================================================== -->

<div class="dashboard">


<!-- =================================================
     STUDENTS
================================================== -->

<aside class="students">

    <h2>
        My Students
    </h2>


    <div id="students-list">

        <div class="empty">
            Loading students...
        </div>

    </div>

</aside>



<!-- =================================================
     CHAT
================================================== -->

<main class="chat">


    <!-- CHAT HEADER -->

    <div class="chat-header">

        <h2 id="chat-student-name">
            Select a student
        </h2>

        <p id="chat-student-email">
            Choose a student from the left.
        </p>

    </div>



    <!-- MESSAGES -->

    <div
        id="messages"
        class="messages">

        <div class="empty">
            Select a student to start chatting.
        </div>

    </div>



    <!-- ATTACHMENT STATUS -->

    <div
        id="attachment-status"
        class="attachment-bar">
    </div>



    <!-- COMPOSER -->

    <div class="composer">


        <!-- FILE INPUT -->

        <input
            type="file"
            id="file-input"
            accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime,application/pdf">



        <!-- ATTACHMENT BUTTON -->

        <button
            type="button"
            class="attach-button"
            onclick="openFilePicker()"
            title="Attach photo, video or PDF">

            <i class="fa-solid fa-paperclip"></i>

        </button>



        <!-- TEXT INPUT -->

        <input
            type="text"
            id="message-input"
            placeholder="Type a message..."
            autocomplete="off">



        <!-- SEND -->

        <button
            type="button"
            class="send-button"
            id="send-button"
            onclick="sendMessage()">

            <i class="fa-solid fa-paper-plane"></i>

        </button>

    </div>

</main>


</div>

<script>


// =====================================================
// CONFIGURATION
// =====================================================

const API_BASE_URL =
    "https://raptora-website.onrender.com";


const token =
    localStorage.getItem("token");


let currentStudent = null;

let selectedFile = null;

let pollingTimer = null;



// =====================================================
// AUTH CHECK
// =====================================================

if (!token) {

    window.location.href =
        "frontend/login.html";

}



// =====================================================
// LOGOUT
// =====================================================

function logout() {

    localStorage.removeItem("token");

    window.location.href =
        "frontend/login.html";

}



// =====================================================
// GET CURRENT MENTOR ID
// =====================================================

function getCurrentMentorId() {

    try {

        const parts =
            token.split(".");

        const payload =
            JSON.parse(
                atob(parts[1])
            );

        return (
            payload.id ||
            payload._id
        );

    } catch (error) {

        console.error(
            "Unable to read token:",
            error
        );

        return null;

    }

}



// =====================================================
// LOAD MY STUDENTS
// =====================================================

async function loadStudents() {

    try {

        const response =
            await fetch(
                `${API_BASE_URL}/api/mentors/my-students`,
                {
                    method: "GET",

                    headers: {
                        Authorization:
                            `Bearer ${token}`
                    }
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to load students."
            );

        }


        renderStudents(
            data.students || []
        );


    } catch (error) {

        console.error(
            "Students error:",
            error
        );


        document.getElementById(
            "students-list"
        ).innerHTML = `

            <div class="empty">

                ${escapeHtml(error.message)}

            </div>

        `;

    }

}



// =====================================================
// RENDER STUDENTS
// =====================================================

function renderStudents(students) {

    const container =
        document.getElementById(
            "students-list"
        );


    if (!students.length) {

        container.innerHTML = `

            <div class="empty">

                No students assigned yet.

            </div>

        `;

        return;

    }


    container.innerHTML =
        students.map(
            (student, index) => {

                return `

                    <div
                        class="student"
                        data-student-id="${escapeAttribute(student._id)}"
                        onclick="selectStudentByIndex(${index})">

                        <div class="student-name">

                            ${escapeHtml(student.name)}

                        </div>

                        <div class="student-email">

                            ${escapeHtml(student.email)}

                        </div>

                    </div>

                `;

            }
        ).join("");


    // Store students safely
    window.mentorStudents =
        students;

}



// =====================================================
// SELECT STUDENT
// =====================================================

function selectStudentByIndex(index) {

    const students =
        window.mentorStudents || [];


    const student =
        students[index];


    if (!student) {
        return;
    }


    currentStudent =
        student;


    document
        .querySelectorAll(".student")
        .forEach(
            element =>
                element.classList.remove(
                    "active"
                )
        );


    const selectedElement =
        document.querySelector(
            `[data-student-id="${student._id}"]`
        );


    if (selectedElement) {

        selectedElement.classList.add(
            "active"
        );

    }


    document.getElementById(
        "chat-student-name"
    ).textContent =
        student.name;


    document.getElementById(
        "chat-student-email"
    ).textContent =
        student.email;


    clearSelectedFile();

    loadConversation();

    startPolling();

}



// =====================================================
// LOAD CONVERSATION
// =====================================================

async function loadConversation() {

    if (!currentStudent) {
        return;
    }


    try {

        const response =
            await fetch(

                `${API_BASE_URL}/api/messages/conversation/${currentStudent._id}`,

                {
                    method: "GET",

                    headers: {
                        Authorization:
                            `Bearer ${token}`
                    }
                }

            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to load messages."
            );

        }


        renderMessages(
            data.messages || []
        );


    } catch (error) {

        console.error(
            "Conversation error:",
            error
        );

    }

}



// =====================================================
// POLLING
// =====================================================

function startPolling() {

    if (pollingTimer) {

        clearInterval(
            pollingTimer
        );

    }


    pollingTimer =
        setInterval(
            loadConversation,
            5000
        );

}



// =====================================================
// RENDER MESSAGES
// =====================================================

function renderMessages(messages) {

    const container =
        document.getElementById(
            "messages"
        );


    if (!messages.length) {

        container.innerHTML = `

            <div class="empty">

                No messages yet.

            </div>

        `;

        return;

    }


    const mentorId =
        getCurrentMentorId();


    container.innerHTML =
        messages.map(
            message => {

                const senderId =
                    typeof message.sender === "object"
                        ? message.sender._id
                        : message.sender;


                const isMentor =
                    String(senderId) ===
                    String(mentorId);


                let attachment = "";


                if (message.fileUrl) {

                    attachment =
                        renderAttachment(
                            message
                        );

                }


                return `

                    <div
                        class="message ${isMentor ? "mentor" : "student"}">

                        ${
                            message.content
                                ? `<div>${escapeHtml(message.content)}</div>`
                                : ""
                        }

                        ${attachment}

                        <span class="message-time">

                            ${formatTime(message.createdAt)}

                        </span>

                    </div>

                `;

            }
        ).join("");


    container.scrollTop =
        container.scrollHeight;

}



// =====================================================
// RENDER ATTACHMENT
// =====================================================

function renderAttachment(message) {

    const url =
        message.fileUrl || "";


    const name =
        message.fileName ||
        "Attachment";


    const mime =
        message.mimeType ||
        "";



    // IMAGE

    if (
        mime.startsWith("image/")
    ) {

        return `

            <a
                href="${escapeAttribute(url)}"
                target="_blank"
                rel="noopener noreferrer">

                <img
                    src="${escapeAttribute(url)}"
                    class="attachment-image"
                    alt="${escapeAttribute(name)}">

            </a>

        `;

    }



    // VIDEO

    if (
        mime.startsWith("video/")
    ) {

        return `

            <video
                class="attachment-video"
                controls
                preload="metadata">

                <source
                    src="${escapeAttribute(url)}"
                    type="${escapeAttribute(mime)}">

                Your browser does not support video.

            </video>

        `;

    }



    // PDF / OTHER FILE

    return `

        <a
            href="${escapeAttribute(url)}"
            target="_blank"
            rel="noopener noreferrer"
            class="file-card">

            <i class="fa-solid fa-file-pdf"></i>

            ${escapeHtml(name)}

        </a>

    `;

}



// =====================================================
// OPEN FILE PICKER
// =====================================================

function openFilePicker() {

    if (!currentStudent) {

        alert(
            "Please select a student first."
        );

        return;

    }


    document
        .getElementById("file-input")
        .click();

}



// =====================================================
// FILE SELECTION
// =====================================================

document
    .getElementById("file-input")
    .addEventListener(
        "change",
        function(event) {

            const file =
                event.target.files[0];


            if (!file) {
                return;
            }



            // 50MB LIMIT

            if (
                file.size >
                50 * 1024 * 1024
            ) {

                alert(
                    "File must be 50MB or smaller."
                );


                event.target.value =
                    "";


                selectedFile =
                    null;


                return;

            }


            selectedFile =
                file;


            document.getElementById(
                "attachment-status"
            ).textContent =
                `📎 ${file.name}`;

        }
    );



// =====================================================
// CLEAR SELECTED FILE
// =====================================================

function clearSelectedFile() {

    selectedFile =
        null;


    const input =
        document.getElementById(
            "file-input"
        );


    if (input) {

        input.value =
            "";

    }


    const status =
        document.getElementById(
            "attachment-status"
        );


    if (status) {

        status.textContent =
            "";

    }

}



// =====================================================
// SEND MESSAGE
// =====================================================

async function sendMessage() {

    if (!currentStudent) {

        alert(
            "Please select a student first."
        );

        return;

    }


    const input =
        document.getElementById(
            "message-input"
        );


    const content =
        input.value.trim();


    if (
        !content &&
        !selectedFile
    ) {

        return;

    }


    const sendButton =
        document.getElementById(
            "send-button"
        );


    sendButton.disabled =
        true;


    try {

        let response;



        // =============================================
        // SEND FILE
        // =============================================

        if (selectedFile) {

            const formData =
                new FormData();


            formData.append(
                "receiverId",
                currentStudent._id
            );


            if (content) {

                formData.append(
                    "content",
                    content
                );

            }


            formData.append(
                "file",
                selectedFile
            );


            response =
                await fetch(
                    `${API_BASE_URL}/api/messages/upload`,
                    {
                        method: "POST",

                        headers: {
                            Authorization:
                                `Bearer ${token}`
                        },

                        body: formData
                    }
                );

        }



        // =============================================
        // SEND TEXT
        // =============================================

        else {

            response =
                await fetch(
                    `${API_BASE_URL}/api/messages/send`,
                    {
                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            Authorization:
                                `Bearer ${token}`

                        },

                        body: JSON.stringify({

                            receiverId:
                                currentStudent._id,

                            content:
                                content

                        })

                    }
                );

        }



        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Message could not be sent."
            );

        }



        // CLEAR COMPOSER

        input.value =
            "";

        clearSelectedFile();



        // REFRESH CHAT

        await loadConversation();


    } catch (error) {

        console.error(
            "Send message error:",
            error
        );


        alert(
            error.message
        );


    } finally {

        sendButton.disabled =
            false;

    }

}



// =====================================================
// ENTER TO SEND
// =====================================================

document
    .getElementById("message-input")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );



// =====================================================
// HELPERS
// =====================================================

function formatTime(date) {

    if (!date) {
        return "";
    }


    return new Date(date)
        .toLocaleString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );

}



function escapeHtml(value) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}



function escapeAttribute(value) {

    return escapeHtml(value);

}



// =====================================================
// START DASHBOARD
// =====================================================

loadStudents();


</script>

</body>

</html>
