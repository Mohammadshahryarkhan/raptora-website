</div>

<script>

const API_BASE_URL = "https://raptora-website.onrender.com";

const token = localStorage.getItem("token");

let currentStudent = null;
let selectedFile = null;
let pollingTimer = null;


// =====================================================
// AUTH
// =====================================================

if (!token) {
    window.location.href = "frontend/login.html";
}


// =====================================================
// LOGOUT
// =====================================================

function logout() {

    localStorage.removeItem("token");

    window.location.href = "frontend/login.html";
}


// =====================================================
// LOAD STUDENTS
// =====================================================

async function loadStudents() {

    try {

        const response = await fetch(
            `${API_BASE_URL}/api/auth/users`,
            {
                headers: {
                    Authorization: `Bearer ${token}`
                }
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || "Unable to load students");
        }

        renderStudents(data.users || []);

    } catch (error) {

        console.error(error);

        document.getElementById("students-list").innerHTML = `
            <div class="empty">
                ${escapeHtml(error.message)}
            </div>
        `;
    }
}


// =====================================================
// RENDER STUDENTS
// =====================================================

function renderStudents(users) {

    const container =
        document.getElementById("students-list");

    const mentorId = getCurrentMentorId();

    const students = users.filter(user => {

        if (!user.assignedMentor) {
            return false;
        }

        const assignedId =
            typeof user.assignedMentor === "object"
                ? user.assignedMentor._id
                : user.assignedMentor;

        return assignedId === mentorId;

    });


    if (!students.length) {

        container.innerHTML = `
            <div class="empty">
                No students assigned yet.
            </div>
        `;

        return;
    }


    container.innerHTML = students.map(student => {

        return `
            <div
                class="student"
                onclick='selectStudent(${JSON.stringify(student)})'>

                <div class="student-name">
                    ${escapeHtml(student.name)}
                </div>

                <div class="student-email">
                    ${escapeHtml(student.email)}
                </div>

            </div>
        `;

    }).join("");
}


// =====================================================
// GET CURRENT MENTOR ID
// =====================================================

function getCurrentMentorId() {

    try {

        const payload =
            JSON.parse(atob(token.split(".")[1]));

        return payload.id || payload._id;

    } catch (error) {

        console.error("Unable to read token", error);

        return null;
    }
}


// =====================================================
// SELECT STUDENT
// =====================================================

function selectStudent(student) {

    currentStudent = student;

    document
        .querySelectorAll(".student")
        .forEach(el => el.classList.remove("active"));

    event.currentTarget.classList.add("active");


    document.getElementById("chat-student-name").textContent =
        student.name;

    document.getElementById("chat-student-email").textContent =
        student.email;


    loadConversation();

    startPolling();
}


// =====================================================
// LOAD CONVERSATION
// =====================================================

async function loadConversation() {

    if (!currentStudent) return;

    try {

        const response = await fetch(
            `${API_BASE_URL}/api/messages/conversation/${currentStudent._id}`,
            {
                headers: {
                    Authorization: `Bearer ${token}`
                }
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || "Unable to load messages");
        }

        renderMessages(data.messages || []);

    } catch (error) {

        console.error("Conversation error:", error);

    }
}


// =====================================================
// POLLING
// =====================================================

function startPolling() {

    if (pollingTimer) {
        clearInterval(pollingTimer);
    }

    pollingTimer = setInterval(
        loadConversation,
        5000
    );
}


// =====================================================
// RENDER MESSAGES
// =====================================================

function renderMessages(messages) {

    const container =
        document.getElementById("messages");

    if (!messages.length) {

        container.innerHTML = `
            <div class="empty">
                No messages yet.
            </div>
        `;

        return;
    }


    container.innerHTML = messages.map(message => {

        const senderId =
            typeof message.sender === "object"
                ? message.sender._id
                : message.sender;

        const mentorId =
            getCurrentMentorId();

        const isMentor =
            senderId === mentorId;


        let attachment = "";

        if (message.fileUrl) {

            attachment =
                renderAttachment(message);

        }


        return `
            <div class="message ${isMentor ? "mentor" : "student"}">

                ${
                    message.content
                        ? `<div>${escapeHtml(message.content)}</div>`
                        : ""
                }

                ${attachment}

                <span class="message-time">
                    ${formatTime(message.createdAt)}
                </span>

            </div>
        `;

    }).join("");


    container.scrollTop =
        container.scrollHeight;
}


// =====================================================
// ATTACHMENT RENDERER
// =====================================================

function renderAttachment(message) {

    const url = message.fileUrl || "";
    const name = message.fileName || "Attachment";
    const mime = message.mimeType || "";


    if (mime.startsWith("image/")) {

        return `
            <a href="${escapeAttribute(url)}"
               target="_blank">

                <img
                    src="${escapeAttribute(url)}"
                    class="attachment-image"
                    alt="${escapeAttribute(name)}">

            </a>
        `;
    }


    if (mime.startsWith("video/")) {

        return `
            <video
                class="attachment-video"
                controls>

                <source
                    src="${escapeAttribute(url)}"
                    type="${escapeAttribute(mime)}">

            </video>
        `;
    }


    return `
        <a
            href="${escapeAttribute(url)}"
            target="_blank"
            class="file-card">

            <i class="fa-solid fa-file-pdf"></i>

            ${escapeHtml(name)}

        </a>
    `;
}


// =====================================================
// FILE PICKER
// =====================================================

function openFilePicker() {

    if (!currentStudent) {

        alert("Please select a student first.");

        return;
    }

    document
        .getElementById("file-input")
        .click();
}


// =====================================================
// FILE SELECTION
// =====================================================

document
    .getElementById("file-input")
    .addEventListener("change", function(event) {

        const file =
            event.target.files[0];

        if (!file) return;


        if (file.size > 50 * 1024 * 1024) {

            alert("File must be 50MB or smaller.");

            event.target.value = "";

            return;
        }


        selectedFile = file;


        document.getElementById("attachment-status").textContent =
            `📎 ${file.name}`;

    });


// =====================================================
// SEND MESSAGE
// =====================================================

async function sendMessage() {

    if (!currentStudent) {

        alert("Please select a student first.");

        return;
    }


    const input =
        document.getElementById("message-input");

    const content =
        input.value.trim();


    if (!content && !selectedFile) {
        return;
    }


    const sendButton =
        document.getElementById("send-button");

    sendButton.disabled = true;


    try {

        let response;


        // =============================================
        // FILE MESSAGE
        // =============================================

        if (selectedFile) {

            const formData =
                new FormData();

            formData.append(
                "receiverId",
                currentStudent._id
            );

            if (content) {

                formData.append(
                    "content",
                    content
                );
            }


            formData.append(
                "file",
                selectedFile
            );


            response = await fetch(
                `${API_BASE_URL}/api/messages/upload`,
                {
                    method: "POST",

                    headers: {
                        Authorization: `Bearer ${token}`
                    },

                    body: formData
                }
            );

        }


        // =============================================
        // NORMAL TEXT MESSAGE
        // =============================================

        else {

            response = await fetch(
                `${API_BASE_URL}/api/messages/send`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        Authorization: `Bearer ${token}`
                    },

                    body: JSON.stringify({
                        receiverId:
                            currentStudent._id,

                        content
                    })
                }
            );

        }


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Message could not be sent."
            );
        }


        input.value = "";

        selectedFile = null;

        document.getElementById("file-input").value = "";

        document.getElementById("attachment-status").textContent = "";


        await loadConversation();


    } catch (error) {

        console.error(error);

        alert(error.message);

    } finally {

        sendButton.disabled = false;

    }
}


// =====================================================
// ENTER TO SEND
// =====================================================

document
    .getElementById("message-input")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();
        }

    });


// =====================================================
// HELPERS
// =====================================================

function formatTime(date) {

    if (!date) return "";

    return new Date(date).toLocaleString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function escapeAttribute(value) {

    return escapeHtml(value);
}


// =====================================================
// START
// =====================================================

loadStudents();

</script>

</body>
